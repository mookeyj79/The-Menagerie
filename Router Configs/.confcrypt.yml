# .confcrypt.yml  (confcrypt v2, whole-line)
#
# Resolved like .sops.yaml: starting from the directory that CONTAINS the
# file being processed, confcrypt walks upward and uses the first
# .confcrypt.yml it finds (~/.confcrypt.yml is a last resort, --config wins).
#
# Recipients are NOT listed here. They are read from the nearest .sops.yaml
# (every age recipient in its creation_rules), so SOPS and confcrypt cannot
# drift apart.
#
# identity : optional path to an age identity (private key) file used for
#            decrypt. Also resolved from --identity, $SOPS_AGE_KEY_FILE, then
#            ~/.sops/keys.txt. Never put a raw key here.
#
# filetypes: one entry per dialect.
#   comment  : comment syntax the target device ignores. A protected line is
#              committed as   <comment> confcrypt v2 <age blob>
#              followed by its dummy line.
#   files    : optional globs relative to this file; a glob match beats the
#              file extension when picking the dialect.
#   rules    : list of {regex, dummy}. A line matching `regex` (re.search) is
#              hidden WHOLE and replaced by `dummy`. First matching rule wins,
#              so put specific secret rules before the MAC rule. `dummy` must
#              match its own `regex` (checked at load) so a dummy is never a
#              hole in the scan; "already encrypted" means a metadata line
#              directly above an exact dummy.
#   tripwire : optional broad regex that flags suspicious lines no rule
#              covers (used by `check`).
#
# Write regexes narrowly: a protected line disappears whole from diffs.
# Rules marked SPECULATIVE are not exercised by any file audited so far.

filetypes:
  rsc:
    comment: "#"
    tripwire: '(?i)\b(password|passphrase|secret|private-key|pre-shared-key|auth-key|psk)\s*='
    rules:
      # /user add name=admin group=full password=...
      - regex: '^\s*/user add\b.*\bpassword='
        dummy: '/user add name=REDACTED group=REDACTED password=REDACTED'
      # /routing/ospf/interface-template add ... auth-key=...
      - regex: '\bauth-key='
        dummy: '/routing/ospf/interface-template add auth-key=REDACTED'
      # Wi-Fi pre-shared keys (security profiles, wifi security, wireless).
      - regex: '\b(wpa2?-)?pre-shared-key='
        dummy: '/interface/wifi/security add pre-shared-key=REDACTED'
      # Wi-Fi / certificate passphrases.
      - regex: '\bpassphrase='
        dummy: '/interface/wifi/security add passphrase=REDACTED'
      # /snmp community add name=<community>  (the community name is the secret)
      - regex: '^\s*/snmp community\b.*\bname='
        dummy: '/snmp community add name=REDACTED'
      # SPECULATIVE: PPP secrets.
      - regex: '^\s*/ppp secret\b.*\bpassword='
        dummy: '/ppp secret add name=REDACTED password=REDACTED'
      # SPECULATIVE: WireGuard private keys.
      - regex: '\bprivate-key='
        dummy: '/interface/wireguard add private-key=REDACTED'
      # SPECULATIVE: IPsec identity secrets.
      - regex: '^\s*/ip ipsec identity\b.*\bsecret='
        dummy: '/ip ipsec identity add secret=REDACTED'
      # SPECULATIVE: RADIUS shared secrets.
      - regex: '^\s*/radius\b.*\bsecret='
        dummy: '/radius add secret=REDACTED'
      # SPECULATIVE: e-mail tool password.
      - regex: '^\s*/tool e-mail\b.*\bpassword='
        dummy: '/tool e-mail set password=REDACTED'
      # Every MAC address (device identifiers). Last: a line holding a
      # secret AND a MAC gets the secret dummy.
      - regex: '\b(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b'
        dummy: '# REDACTED 00:00:00:00:00:00'

  ios:
    comment: "!"
    tripwire: '(?i)\b(secret|password|key-string|key-hash|community|md5|pre-shared-key|private-key)\b'
    rules:
      # enable secret 9 $9$...   /   enable password 7 ...
      - regex: '^\s*enable\s+(secret|password)\b'
        dummy: 'enable secret 9 REDACTED'
      # username wonka ... secret 9 $9$...   (also `password 7`)
      - regex: '^\s*username\s+\S+.*\b(secret|password)\b'
        dummy: 'username REDACTED secret 9 REDACTED'
      # snmp-server community <string> RO|RW
      - regex: '^\s*snmp-server\s+community\b'
        dummy: 'snmp-server community REDACTED RO'
      # key chains
      - regex: '^\s*key-string\b'
        dummy: 'key-string REDACTED'
      # ip ssh pubkey-chain / username wonka / key-hash ssh-rsa AAAA...
      - regex: '^\s*key-hash\b'
        dummy: 'key-hash ssh-rsa REDACTED'
      # ip ospf message-digest-key 1 md5 7 0834058A0B1C
      - regex: '\bmd5\s+7\s+\S'
        dummy: 'ip ospf message-digest-key 1 md5 7 REDACTED'
      # line vty / console:  password 7 0822455D0A16
      - regex: '^\s*password\s+\d\s+\S'
        dummy: 'password 7 REDACTED'
      # SPECULATIVE: crypto isakmp pre-shared keys.
      - regex: '^\s*crypto isakmp key\b'
        dummy: 'crypto isakmp key REDACTED address 0.0.0.0'
      # SPECULATIVE: TACACS+/RADIUS keys.
      - regex: '^\s*(tacacs-server|radius-server)\s+.*\bkey\b'
        dummy: 'tacacs-server key 7 REDACTED'
      # Every MAC address: colon, dash and Cisco dotted forms.
      - regex: '(?i)\b(?:[0-9a-f]{2}[:-]){5}[0-9a-f]{2}\b|\b[0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4}\b'
        dummy: '! REDACTED 0000.0000.0000'

  wifi:
    comment: "#"
    files:
      - "WiFi's.txt"
    rules:
      # Everything in the Wi-Fi notes file: SSIDs, PSKs, the license key.
      - regex: '^.+$'
        dummy: 'REDACTED'

######################################
# Ansible: Linux - Setup Environment #
######################################
---
- name: Linux - Setup User Environment
  become: true
  block:
    - name: Update repositories
      ansible.builtin.include_role:
        name: generic_update_system
      vars:
        generic_update_system_repos_only: true

    - name: Check for Docker
      ansible.builtin.include_role:
        name: generic_docker_check

    - name: Set Variables - Primary User
      ansible.builtin.set_fact:
        primary_user:
          username: "{{ lookup('community.hashi_vault.hashi_vault', 'secret/data/users/primary_user')['username'] }}"
      when: primary_user is not defined or primary_user is none

    - name: Set list of Users
      ansible.builtin.set_fact:
        ssh_users: >-
          {{
            [primary_user.username, 'ansible', 'terraform'] +
            (['traefik'] if generic_docker_check else [])
          }}

    ##########
    # Debian #
    ##########
    - name: Debian Systems
      when: ansible_facts['os_family'] == 'Debian'
      block:
        - name: Install packages (Debian)
          ansible.builtin.apt:
            name:
              - clamav
              - clamav-freshclam
              - rkhunter
              - lynis
              - aide
              - unattended-upgrades
              - apt-listchanges
              - ssh-audit
              - ufw
            state: present

        - name: Regenerate Locales (Debian)
          community.general.locale_gen:
            name: en_US.UTF-8
            state: present

        - name: Set System Locale (Debian)
          ansible.builtin.copy:
            dest: /etc/default/locale
            content: |
              LANG="en_US.UTF-8"
            owner: root
            group: root
            mode: '0644'

    ##########
    # RedHat #
    ##########
    - name: RedHat Systems
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Install EPEL repository (RedHat)
          ansible.builtin.dnf:
            name: epel-release
            state: present

        - name: Install packages (RedHat)
          ansible.builtin.dnf:
            name:
              - clamav
              - clamav-update
              - rkhunter
              - lynis
              - aide
              - dnf-automatic
              - python3
              - ufw
            state: present

        - name: Download 'ssh-audit' Script (RedHat)
          ansible.builtin.get_url:
            url: https://raw.githubusercontent.com/jtesta/ssh-audit/master/ssh-audit.py
            dest: /usr/local/bin/ssh-audit
            mode: '0755'
            force: false

        - name: Regenerate Locales (RedHat)
          ansible.builtin.command: >
            localedef -i en_US -f UTF-8 en_US.UTF-8
          args:
            creates: /usr/lib/locale/en_US.utf8

        - name: Set System Locale (RedHat)
          ansible.builtin.copy:
            dest: /etc/locale.conf
            content: |
              LANG=en_US.UTF-8
            mode: '0644'

    #####################
    # General Hardening #
    #####################
    - name: General Hardening
      block:
        - name: Create a series of directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ primary_user.username }}"
            group: "{{ primary_user.username }}"
            mode: '0755'
          loop:
            - /opt/scripts
            - /opt/scripts/hardening
            - /opt/scripts/hardening/aide
            - /opt/scripts/hardening/clamav
            - /opt/scripts/hardening/lynis
            - /opt/scripts/hardening/rkhunter
            - /opt/scripts/hardening/ssh
            - /opt/scripts/hardening/unattended_updates

        - name: IP Hardening
          ansible.builtin.template:
            src: "{{ role_path }}/templates/50-ip-sec.conf.j2"
            dest: "/etc/sysctl.d/50-ip-sec.conf"
            mode: '0644'
          notify: Apply 'sysctl' Settings

        - name: Out-of-Memory Protection
          ansible.builtin.copy:
            src: "{{ role_path }}/files/99-oom-protection.conf"
            dest: "/etc/sysctl.d/99-oom-protection.conf"
            mode: '0644'
          notify: Apply 'sysctl' Settings

        - name: Apply 'sysctl' Settings
          ansible.builtin.command: sysctl --system
          changed_when: false

    ######################
    # Unattended Updates #
    ######################
    - name: Unattended Updates
      block:
        - name: Unattended Updates (Debian)
          when: ansible_facts['os_family'] == 'Debian'
          block:
            - name: Reconfigure 'unattended-upgrades' with Low Priority (Debian)
              ansible.builtin.command:
                cmd: dpkg-reconfigure --priority=low unattended-upgrades
              changed_when: false

            - name: Create Override Directory for 'apt-daily-upgrade.timer' (Debian)
              ansible.builtin.file:
                path: /etc/systemd/system/apt-daily-upgrade.timer.d
                state: directory
                mode: '0755'

            - name: Override 'apt-daily-upgrade.timer' Settings (Debian)
              ansible.builtin.copy:
                src: "{{ role_path }}/files/unattended_updates/override.conf"
                dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
                mode: '0644'

            - name: Enable and Start 'apt-daily-upgrade.timer' (Debian)
              ansible.builtin.systemd:
                name: apt-daily-upgrade.timer
                enabled: true
                state: started

            - name: Copy 'unattended-update' Reboot Configurations (Debian)
              ansible.builtin.copy:
                src: "{{ role_path }}/files/unattended_updates/50-unattended-upgrades"
                dest: /etc/apt/apt.conf.d/50-unattended-upgrades
                mode: '0644'

        - name: Unattended Updates - RedHat
          when: ansible_facts['os_family'] == 'RedHat'
          block:
            - name: Create Override Directories for 'dnf-automatic' (RedHat)
              ansible.builtin.file:
                path: "/etc/systemd/system/{{ item }}"
                state: directory
                mode: '0755'
              loop:
                - dnf-automatic.timer.d
                - dnf-automatic-reboot.timer.d

            - name: Override 'dnf-automatic.timer' Settings (RedHat)
              ansible.builtin.copy:
                src: "{{ role_path }}/files/unattended_updates/{{ item.src }}"
                dest: "/etc/systemd/system/{{ item.dest }}"
                mode: '0644'
              loop:
                - src: override.conf
                  dest: dnf-automatic.timer.d/override.conf
                - src: override_reboot.conf
                  dest: dnf-automatic-reboot.timer.d/override.conf

            - name: Enable and Start dnf-automatic.timer (RedHat)
              ansible.builtin.systemd:
                name: "{{ item }}"
                enabled: true
                state: started
              loop:
                - dnf-automatic.timer
                - dnf-automatic-reboot.timer

        - name: Copy 'unattended-update' Script
          ansible.builtin.copy:
            src: "{{ role_path }}/files/unattended_updates/unattended_notify.sh"
            dest: /opt/scripts/hardening/unattended_updates/unattended_notify.sh
            owner: "{{ primary_user.username }}"
            group: "{{ primary_user.username }}"
            mode: '0755'

    #################
    # SSH Hardening #
    #################
    - name: SSH Hardening
      block:
        - name: Create 'sshusers' Group
          ansible.builtin.group:
            name: sshusers
            state: present

        - name: Add Users to 'sshusers'
          ansible.builtin.user:
            name: "{{ item }}"
            groups: sshusers
            append: true
          loop: "{{ ssh_users }}"

        - name: Copy SSH Config Files
          ansible.builtin.copy:
            src: "{{ role_path }}/files/ssh/{{ item.src }}"
            dest: "/etc/ssh/{{ item.dest }}"
            mode: '0644'
          loop:
            - { src: sshd_config, dest: sshd_config }
            - { src: ssh-audit_hardening.conf, dest: sshd_config.d/ssh-audit_hardening.conf }

        - name: Restart SSH service
          ansible.builtin.service:
            name: ssh
            state: restarted

        - name: Copy Moduli Generation Script
          ansible.builtin.copy:
            src: "{{ role_path }}/files/moduli/generate_moduli.sh"
            dest: /opt/scripts/hardening/ssh/generate_moduli.sh
            owner: "{{ primary_user.username }}"
            group: "{{ primary_user.username }}"
            mode: '0755'

        - name: Copy Moduli Generation Service
          ansible.builtin.copy:
            src: "{{ role_path }}/files/moduli/generate-moduli.service"
            dest: /etc/systemd/system/generate-moduli.service
            mode: '0644'

        - name: Reload 'systemd'
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Enable generate-moduli.service to run manually or at boot
          ansible.builtin.systemd:
            name: generate-moduli.service
            enabled: true
            state: stopped

        - name: Ensure .ssh directory exists for user
          ansible.builtin.file:
            path: "/home/{{ item }}/.ssh"
            state: directory
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0700'
          loop: "{{ ssh_users }}"

        - name: Copy User SSH config
          ansible.builtin.copy:
            src: ssh_config_hardened
            dest: "/home/{{ item }}/.ssh/config"
            owner: "{{ item }}"
            group: "{{ item }}"
            mode: '0600'
          loop: "{{ ssh_users }}"

    ##########
    # ClamAV #
    ##########
    - name: ClamAV
      block:
        - name: Copy 'clamscan' Script
          ansible.builtin.copy:
            src: "{{ role_path }}/files/clamscan.sh"
            dest: /opt/scripts/hardening/clamav/clamscan.sh
            owner: "{{ primary_user.username }}"
            group: "{{ primary_user.username }}"
            mode: '0755'

    ############
    # RKHunter #
    ############
    - name: RKHunter
      block:
        - name: Copy 'rkhunter' Script
          ansible.builtin.copy:
            src: "{{ role_path }}/files/rkhunter.sh"
            dest: /opt/scripts/hardening/rkhunter/rkhunter.sh
            owner: "{{ primary_user.username }}"
            group: "{{ primary_user.username }}"
            mode: '0755'

        - name: Update RKHunter
          ansible.builtin.command: rkhunter --update
          register: rkhunter_update
          changed_when: "'Update completed' in rkhunter_update.stdout"

        - name: Baseline with RKHunter
          ansible.builtin.command: rkhunter --propupd
          args:
            creates: /var/lib/rkhunter/db/rkhunter.dat

    #########
    # Lynis #
    #########
    - name: Lynis
      block:
        - name: Copy 'lynis' Script
          ansible.builtin.copy:
            src: "{{ role_path }}/files/lynis.sh"
            dest: /opt/scripts/hardening/lynis/lynis.sh
            owner: "{{ primary_user.username }}"
            group: "{{ primary_user.username }}"
            mode: '0755'

    ########
    # AIDE #
    ########
    - name: AIDE
      block:
        - name: Copy 'aide' Scripts
          ansible.builtin.copy:
            src: "{{ role_path }}/files/aide/{{ item }}"
            dest: "/opt/scripts/hardening/aide/{{ item }}"
            owner: "{{ primary_user.username }}"
            group: "{{ primary_user.username }}"
            mode: '0755'
          loop:
            - aide.sh
            - aide_rebaseline.sh

        - name: Initialize AIDE Database
          ansible.builtin.command: aideinit
          args:
            creates: /var/lib/aide/aide.db.new

        - name: Move Baseline Database into Place
          ansible.builtin.copy:
            src: /var/lib/aide/aide.db.new
            dest: /var/lib/aide/aide.db
            remote_src: true
            mode: '0600'

        - name: Run Integrity Check
          ansible.builtin.command: aide.wrapper --check
          register: aide_check
          changed_when: false

    #######
    # UFW #
    #######
    - name: UFW
      block:
        - name: Copy UFW Configs
          ansible.builtin.copy:
            src: "{{ role_path }}/files/ufw/{{ item }}"
            dest: "/etc/ufw/{{ item }}"
            mode: '0644'
          loop:
            - ufw.conf
            - before.rules

        - name: Set default UFW policy to deny all incoming traffic
          community.general.ufw:
            direction: incoming
            policy: deny

        - name: Set UFW Rules
          community.general.ufw:
            rule: allow
            port: "{{ item.port }}"
            proto: "{{ item.proto }}"
          loop: "{{ ufw_ports }}"

        - name: Enable UFW
          community.general.ufw:
            state: enabled

    #################
    # Log Rotations #
    #################
    - name: Log Rotations
      block:
        - name: Copy Log Rotation Configs
          ansible.builtin.copy:
            src: "{{ role_path }}/files/logrotate.d/{{ item }}"
            dest: "/etc/logrotate.d/{{ item }}"
            mode: '0644'
          loop:
            - aide
            - clamav
            - lynis
            - rkhunter
            - rsyslog

        - name: Copy Log Rotation Configs (Debian)
          ansible.builtin.copy:
            src: "{{ role_path }}/files/logrotate.d/{{ item }}"
            dest: "/etc/logrotate.d/{{ item }}"
            mode: '0644'
          loop:
            - unattended-upgrades
          when: ansible_facts['os_family'] == 'Debian'

        - name: Copy Log Rotation Configs (RedHat)
          ansible.builtin.copy:
            src: "{{ role_path }}/files/logrotate.d/{{ item }}"
            dest: "/etc/logrotate.d/{{ item }}"
            mode: '0644'
          loop:
            - dnf-automatic
          when: ansible_facts['os_family'] == 'RedHat'

    ########
    # CRON #
    ########
    - name: CRON Jobs
      block:
        - name: Configure CRON
          ansible.builtin.cron:
            name: "{{ item.name }}"
            minute: "{{ item.minute }}"
            hour: "{{ item.hour }}"
            weekday: "{{ item.weekday }}"
            job: "{{ item.job }}"
          loop:
            - name: ClamScan
              job: /opt/scripts/hardening/clamav/clamscan.sh
              weekday: '*'
              hour: 3
              minute: 45
            - name: RKHunter
              job: /opt/scripts/hardening/rkhunter/rkhunter.sh
              weekday: '*'
              hour: 4
              minute: 15
            - name: Lynis
              job: /opt/scripts/hardening/lynis/lynis.sh
              weekday: 2
              hour: 4
              minute: 30
            - name: AIDE
              job: /opt/scripts/hardening/aide/aide.sh
              weekday: 4
              hour: 4
              minute: 30

        - name: Configure Unattended Updates CRON
          ansible.builtin.cron:
            name: "Unattended Updates Notification"
            special_time: reboot
            job: "sleep 300 && /opt/scripts/hardening/unattended_updates/unattended_notify.sh"

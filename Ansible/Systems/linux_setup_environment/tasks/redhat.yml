---
- name: Enable EPEL repository
  ansible.builtin.dnf:
    name:
      - epel-release
    state: present
    update_cache: true

- name: Install packages
  ansible.builtin.dnf:
    name:
      - bat
      - bind-utils
      - btop
      - ca-certificates
      - curl
      - dos2unix
      - eza
      - fastfetch
      - fd-find
      - file
      - fzf
      - git
      - gnupg2
      - helix
      - htop
      - iotop
      - jq
      - llvm
      - lm_sensors
      - make
      - nano
      - nethogs
      - p7zip
      - procps-ng
      - python3
      - python3-devel
      - python3-pip
      - python3-setuptools
      - python3-wheel
      - ripgrep
      - screen
      - starship
      - tmux
      - tree
      - unrar
      - unzip
      - vim-enhanced
      - wget
      - xz
      - yq
      - zoxide
      - zsh
    state: present
    update_cache: true

- name: Install GRUB required packages
  when: linux_setup_environment_install_grub | bool
  ansible.builtin.dnf:
    name:
      - os-prober
    state: present
    update_cache: true

- name: Install Pyenv required packages
  when: linux_setup_environment_install_pyenv | bool
  ansible.builtin.dnf:
    name:
      - bzip2-devel
      - libffi-devel
      - xz-devel
      - ncurses-devel
      - readline-devel
      - sqlite-devel
      - openssl-devel
      - tk-devel
      - zlib-devel
      - python3
      - python3-devel
    state: present
    update_cache: true

- name: Install MOTD required packages
  when: linux_setup_environment_install_motd | bool
  ansible.builtin.dnf:
    name:
      - boxes
      - figlet
      - toilet
    state: present
    update_cache: true

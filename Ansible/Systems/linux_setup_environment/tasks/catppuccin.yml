---
### Setup ###
- name: Ensure ~/.zsh exists
  ansible.builtin.file:
    path: "{{ home }}/.zsh"
    state: directory
    owner: "{{ username }}"
    group: "{{ group }}"
    mode: "0755"

- name: Ensure sources.zsh exists
  ansible.builtin.file:
    path: "{{ home }}/.zsh/sources.zsh"
    state: touch
    owner: "{{ username }}"
    group: "{{ group }}"
    mode: "0644"

### Bat ###
- name: Catppuccin - Bat
  vars:
    group: "{{ generic_build_vars_return.primary_user.group }}"
    home: "{{ generic_build_vars_return.primary_user.home }}"
    username: "{{ generic_build_vars_return.primary_user.username }}"
    theme: "{{ linux_setup_environment_install_catppuccin_theme | capitalize }}"

  block:
    - name: Ensure Bat themes folder exists
      ansible.builtin.file:
        path: "{{ home }}/.config/bat/themes"
        state: directory
        owner: "{{ username }}"
        group: "{{ group }}"
        mode: "0755"

    - name: Download Bat theme files
      ansible.builtin.get_url:
        url: "https://github.com/catppuccin/bat/raw/main/themes/{{ theme_file.url }}"
        dest: "{{ home }}/.config/bat/themes/{{ theme_file.dest }}"
        owner: "{{ username }}"
        group: "{{ group }}"
        mode: "0644"
      loop:
        - dest: Catppuccin Latte.tmTheme
          url: Catppuccin%20Latte.tmTheme
        - dest: Catppuccin Frappe.tmTheme
          url: Catppuccin%20Frappe.tmTheme
        - dest: Catppuccin Macchiato.tmTheme
          url: Catppuccin%20Macchiato.tmTheme
        - dest: Catppuccin Mocha.tmTheme
          url: Catppuccin%20Mocha.tmTheme
      loop_control:
        loop_label: "{{ theme_file.dest }}"
        loop_var: theme_file

    - name: Copy Bat configuration file
      ansible.builtin.template:
        src: "{{ role_path }}/templates/catppuccin/bat/config/config.j2"
        dest: "{{ home }}/.config/bat/config"
        owner: "{{ username }}"
        group: "{{ group }}"
        mode: "0644"

    - name: Copy Bat configuration script
      ansible.builtin.copy:
        src: "{{ role_path }}/files/catppuccin/bat/config/init-bat-cache.sh"
        dest: "{{ home }}/.config/bat/init-bat-cache.sh"
        owner: "{{ username }}"
        group: "{{ group }}"
        mode: "0755"

    - name: Add Bat script to 'sources.zsh'
      ansible.builtin.lineinfile:
        path: "{{ home }}/.zsh/sources.zsh"
        line: '[[ -f "$HOME/.config/bat/init-bat-cache.sh" ]] && "$HOME/.config/bat/init-bat-cache.sh"'
        regexp: '^\[\[ -f "\$HOME\/\.config\/bat\/init-bat-cache\.sh" \]\] && "\$HOME\/\.config\/bat\/init-bat-cache\.sh"$'


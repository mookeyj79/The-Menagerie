### Tmux ###
- name: Catppuccin - Tmux
  vars:
    group: "{{ generic_build_vars_return.primary_user.group }}"
    home: "{{ generic_build_vars_return.primary_user.home }}"
    username: "{{ generic_build_vars_return.primary_user.username }}"
    theme: "{{ linux_setup_environment_install_catppuccin_theme | lower }}"

  block:
    - name: Remove old Tmux config
      ansible.builtin.file:
        path: "{{ home }}/.config/tmux/plugins/catppuccin/tmux"
        state: absent

    - name: Install Tmux themes
      ansible.builtin.git:
        repo: https://github.com/catppuccin/tmux.git
        dest: "{{ home }}/.config/tmux/plugins/catppuccin/tmux"
        update: true
        version: v2.1.3

    - name: Fix Permissions for Tmux themes
      ansible.builtin.file:
        path: "{{ home }}/.config/tmux/plugins/catppuccin/tmux"
        state: directory
        recurse: true
        owner: "{{ username }}"
        group: "{{ group }}"

    - name: Copy Tmux configuration file
      ansible.builtin.template:
        src: "{{ role_path }}/templates/catppuccin/tmux/tmux.conf.j2"
        dest: "{{ home }}/.tmux.conf"
        owner: "{{ username }}"
        group: "{{ group }}"
        mode: "0644"


---
- name: Linux - Install STEP Service
  become: true
  block:
    - name: Ensure this is a Linux system
      ansible.builtin.assert:
        that: ansible_facts['system'] == 'Linux'
        fail_msg: "This role should only run on Linux systems."
        success_msg: "Confirmed: Linux system."

    - name: Build variables
      ansible.builtin.include_role:
        name: generic_build_vars
      vars:
        generic_build_vars_request: [primary_user]
        generic_build_vars_inputs:
          primary_user: "{{ primary_user | default({}) }}"

    - name: Ensure `step-cli` is installed
      ansible.builtin.command: step version
      register: step_installed
      changed_when: false
      failed_when: step_installed.rc != 0

    - name: Install Step Services
      when: step_installed.rc == 0 and step_services is defined
      block:
        - name: Create Services
          ansible.builtin.template:
            src: "{{ role_path }}/templates/service.j2"
            dest: "/etc/systemd/system/step-{{ item.name | lower }}.service"
            owner: "root"
            group: "root"
            mode: "0644"
          with_items: "{{ step_services.certs }}"

        - name: Reload systemd units
          ansible.builtin.systemd:
            daemon_reload: true

        - name: Enable and start Step Services
          ansible.builtin.systemd:
            name: "step-{{ item.name | lower }}.service"
            enabled: true
            state: started
          with_items: "{{ step_services.certs }}"

---
- name: Install Step-CA CLI - RedHat
  become: true
  block:
    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Add Smallstep RPM repository
      ansible.builtin.yum_repository:
        name: smallstep
        description: Smallstep Packages
        baseurl: https://packages.smallstep.com/stable/fedora/
        enabled: true
        gpgcheck: true
        repo_gpgcheck: false
        gpgkey: https://packages.smallstep.com/keys/smallstep-0x889B19391F774443.gpg
        state: present

    - name: Install 'step-cli'
      ansible.builtin.dnf:
        name: step-cli
        state: present
        update_cache: true

    - name: Create trust store directory
      ansible.builtin.file:
        path: "/etc/pki/ca-trust/source/anchors"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Fetch Step-CA root
      ansible.builtin.command: >-
        step ca root
        --ca-url {{ ca_server.url }}
        --fingerprint {{ ca_server.fingerprint }}
      register: root_pem
      changed_when: false

    - name: Validate PEM content
      ansible.builtin.assert:
        that:
          - root_pem.stdout is search('-----BEGIN CERTIFICATE-----')
          - root_pem.stdout is search('-----END CERTIFICATE-----')
        fail_msg: "Fetched content did not look like a PEM certificate. Check ca URL/fingerprint."

    - name: Enable CA trust
      ansible.builtin.command: "update-ca-trust enable"
      changed_when: false
      failed_when: false

    - name: Install/refresh Step-CA root certificate
      ansible.builtin.copy:
        content: "{{ root_pem.stdout }}"
        dest: "//etc/pki/ca-trust/source/anchors/step-ca-root.crt"
        owner: root
        group: root
        mode: "0644"
      notify: Update system trust - RedHat

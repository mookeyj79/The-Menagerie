---
- name: Install Step-CA CLI - Debian
  become: true
  block:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Add Smallstep APT repository
      ansible.builtin.deb822_repository:
        name: smallstep
        types: [deb]
        uris: https://packages.smallstep.com/stable/debian
        suites: [debs]
        components: [main]
        signed_by: https://packages.smallstep.com/keys/apt/repo-signing-key.gpg
        enabled: true
        state: present

    - name: Install 'step-cli'
      ansible.builtin.apt:
        name: step-cli
        state: present
        update_cache: true

    - name: Create trust store directory
      ansible.builtin.file:
        path: "/usr/local/share/ca-certificates"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Fetch Step-CA root
      ansible.builtin.command: >-
        step ca root
        --ca-url {{ ca_server.url }}
        --fingerprint {{ ca_server.fingerprint }}
      register: root_pem
      changed_when: false

    - name: Validate PEM content
      ansible.builtin.assert:
        that:
          - root_pem.stdout is search('-----BEGIN CERTIFICATE-----')
          - root_pem.stdout is search('-----END CERTIFICATE-----')
        fail_msg: "Fetched content did not look like a PEM certificate. Check ca URL/fingerprint."

    - name: Install/refresh Step-CA root certificate
      ansible.builtin.copy:
        content: "{{ root_pem.stdout }}"
        dest: "/usr/local/share/ca-certificates/step-ca-root.crt"
        owner: root
        group: root
        mode: "0644"
      notify: Update system trust - Debian

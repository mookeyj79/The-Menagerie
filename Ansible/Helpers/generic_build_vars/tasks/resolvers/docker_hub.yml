---
- name: Resolve 'docker_hub'
  vars:
    resolver_name: "docker_hub"
    resolver_mode: "object"

    resolver_input_object: "{{ generic_build_vars_inputs.docker_hub | default({}) }}"

    resolver_schema:
      password: ""
      username: ""

    resolver_vault_key: "external_services/docker_hub"
    resolver_vault_mount: "{{ generic_build_vars_vault_mount }}"

    resolver_enable_asserts: true
    resolver_asserts_object:
      password: string
      username: string

  ansible.builtin.include_tasks: base.yml

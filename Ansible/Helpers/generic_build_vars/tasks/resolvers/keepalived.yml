---
- name: Resolve 'keepalived'
  vars:
    resolver_name: "keepalived"
    resolver_mode: "object"

    resolver_input_object: "{{ generic_build_vars_inputs.keepalived | default({}) }}"

    resolver_schema:
      password: ""

    resolver_vault_key: "internal_services/keepalived"
    resolver_vault_mount: "{{ generic_build_vars_vault_mount }}"

    resolver_enable_asserts: true
    resolver_asserts_object:
      password: string

  ansible.builtin.include_tasks: base.yml

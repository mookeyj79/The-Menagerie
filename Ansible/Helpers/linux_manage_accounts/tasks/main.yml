---
- name: "Validate 'linux_manage_accounts_groups' is a list"
  ansible.builtin.assert:
    that:
      - linux_manage_accounts_groups is iterable
    fail_msg: "linux_manage_accounts_groups must be a list"
  tags: [users_groups]

- name: "Validate linux_manage_accounts_users is a list"
  ansible.builtin.assert:
    that:
      - linux_manage_accounts_users is iterable
    fail_msg: "linux_manage_accounts_users must be a list"
  tags: [users_groups]

- name: "Ensure groups exist"
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid | default(omit) }}"
    system: "{{ item.system | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ linux_manage_accounts_groups }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [users_groups, groups]

- name: "Ensure users exist"
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: "{{ item.shell | default(omit) }}"
    home: "{{ item.home | default(omit) }}"
    create_home: "{{ item.create_home | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    groups: "{{ item.groups | default(omit) }}"
    append: "{{ item.append | default(true) }}"
    password: "{{ item.password | default(omit) }}"
    system: "{{ item.system | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ linux_manage_accounts_users }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [users_groups, users]

- name: "Ensure authorized_keys for users (if provided)"
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
    manage_dir: true
  loop: "{{ query('subelements', linux_manage_accounts_users, 'ssh_authorized_keys', {'skip_missing': true}) }}"
  loop_control:
    label: "{{ item.0.name }}"
  when:
    - (item.0.state | default('present')) == 'present'
  tags: [users_groups, ssh_keys]

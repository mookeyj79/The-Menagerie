############################
# Redis configuration file #
############################

###########
# Network #
###########

# Listen on all interfaces (lock this down with firewall rules / TLS)
bind 0.0.0.0

# TCP port
port 6379

# Extra safety when exposed
protected-mode yes

# Keep TCP connections alive (in seconds)
tcp-keepalive 300

# TLS configuration for secure access
# tls-port 6379
# tls-cert-file /etc/redis/certs/redis.crt
# tls-key-file /etc/redis/certs/redis.key
# tls-ca-cert-file /etc/redis/certs/ca.crt
# tls-auth-clients yes

############
# Security #
############

# ACL user definitions file
aclfile /usr/local/etc/redis/redis.acl


##############
# Databases  #
##############

# Number of logical databases (0..databases-1)
databases 16


################
# Persistence  #
################

# Use Append Only File (AOF) persistence
appendonly yes

# fsync policy for AOF
#   always   = fsync every write (slow, safest)
#   everysec = fsync once per second (good balance)
#   no       = let OS decide (fastest, less safe)
appendfsync everysec

# Avoid fsync while rewriting AOF to reduce IO pressure
no-appendfsync-on-rewrite yes

# Working directory and data storage path
dir /data


##################
# Performance    #
##################

# Number of I/O threads (for network I/O only, not command execution)
io-threads 4

# Allow I/O threads to handle reads (usually improves throughput)
io-threads-do-reads yes


##################
# Monitoring     #
##################

# Latency monitor threshold in microseconds (100µs = 0.1ms)
latency-monitor-threshold 100


############
# Logging  #
############

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file path (empty string = log to stdout)
logfile /var/log/redis/redis-server.log

---
- name: Step_CA Preparation
  become: true
  block:
    - name: Create Step-CA User
      ansible.builtin.include_role:
        name: linux_manage_accounts
      vars:
        linux_manage_accounts_users:
          - name: step-ca
            comment: Step-CA User
            shell: /sbin/nologin
            create_home: false
            uid: 2005
            append: false

    - name: Check if Docker is installed
      ansible.builtin.include_role:
        name: generic_check_docker

    - name: Create Step CA directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: step-ca
        group: docker
        mode: "0750"
      loop:
        - "{{ apps_dir }}"
        - "{{ apps_dir }}/step-ca"
        - "{{ apps_dir }}/step-ca/certs"
        - "{{ apps_dir }}/step-ca/config"
        - "{{ apps_dir }}/step-ca/data"
        - "{{ apps_dir }}/step-ca/secrets"

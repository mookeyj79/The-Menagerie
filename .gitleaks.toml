# gitleaks configuration for the scanning gate (Scripts/gate/gate.sh).
#
# Default rules stay on; the custom rules close the gaps the audit found.
# Reviewed false positives are recorded either with an inline `gitleaks:allow`
# on the line or as a commented path entry under [[allowlists]] below. There
# is no .gitleaksignore (its line-number fingerprints go stale). Code that only
# names a secret is instead a narrow, value-anchored refinement in the rule's
# own allowlist, each with a lookalike gate test (ADR 0003).

title = "The Menagerie gate"

[extend]
useDefault = true

# ---- custom rules (Go RE2: no lookaheads) -------------------------------
# Values may start with any character except whitespace or a quote, so a real
# secret beginning with `$`, `#`, `<` or `{` is still caught. Placeholders are
# exempted by the "whole-token placeholders" allowlist at the bottom, which
# looks at the captured value only. confcrypt dummy lines are allowed by the
# Encrypted-lines allowlist there too.

[[rules]]
id = "cipassword"
description = "Proxmox cloud-init password"
regex = '''(?i)\bcipassword["']?\s*[:=]\s*["']?([^\s"'][^\s"']{2,})'''
secretGroup = 1
keywords = ["cipassword"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^(var|local|data|module)\.''']

[[rules]]
id = "routeros-password"
description = "RouterOS password= argument with a literal value"
regex = '''(?i)\bpassword="?([^\s"'][^\s"']*)'''
secretGroup = 1
keywords = ["password="]

[[rules]]
id = "routeros-psk"
description = "RouterOS / Wi-Fi pre-shared key, passphrase or routing auth-key"
regex = '''(?i)\b(?:pre-shared-key|passphrase|auth-key|private-key)="?([^\s"'][^\s"']*)'''
secretGroup = 1
keywords = ["pre-shared-key", "passphrase", "auth-key", "private-key"]

[[rules]]
id = "cisco-secret-hash"
description = "Cisco 'secret <type> <hash>' or 'password <type> <hash>'"
regex = '''(?i)\b(?:secret|password)\s+[0-9]\s+(\S{4,})'''
secretGroup = 1
keywords = ["secret", "password"]

[[rules]]
id = "discord-webhook"
description = "Discord webhook URL"
regex = '''https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9_-]{20,}'''
keywords = ["discord"]

[[rules]]
id = "pushover-key"
description = "Pushover application token or user key"
regex = '''(?i)pushover[\w ."'-]{0,30}[:=]\s*["']?([a-z0-9]{30})\b'''
secretGroup = 1
keywords = ["pushover"]

[[rules]]
id = "password-not-placeholder"
description = "password-like assignment whose value is not a placeholder"
regex = '''(?i)(?:password|passwd|pwd|secret|token|psk|passphrase)["']?\s*[:=]\s*["']?([^\s"'][^\s"']{3,})'''
secretGroup = 1
keywords = ["password", "passwd", "pwd", "secret", "token", "psk", "passphrase"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  # `string` is a type in Ansible assert schemas (`password: string`).
  '''(?i)^(changeme|example|null|none|true|false|redacted|string)$''',
  '''^(var|local|data|module|lookup)[.(]''',
  # Code-shape refinements (ADR 0003), each anchored to the whole captured
  # value. The capture stops at whitespace or a quote, so a Terraform call ends
  # at its first `,` or `)`.
  # A call on a Terraform reference: `coalesce(var.vault_token, "")`.
  '''^[A-Za-z_]\w*\((?:var|local|data|module)\.[\w.]*[,)]$''',
  # A dotted macro call on one name: `vmac.kv2_secret(raw)`.
  '''^[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+\([A-Za-z_]\w*\)$''',
]
# A KV v2 Vault path (`secret=kv/data/apps/...` in a hashi_vault lookup) names
# where a secret lives. Matched on the finding itself, not the line, so another
# value on the same line is still scanned.
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''^secret=[\w-]+/data/[\w/-]*$''']

# ---- global allowlist ----------------------------------------------------
# Encrypted lines (story 42), and nothing else: only whole lines that are
# exactly a rule dummy from Router Configs/.confcrypt.yml or a metadata line. A
# stray REDACTED token on any other line is not allowlisted. gitleaks hands the
# line over with its newline(s), hence the \n? and \r?\n? anchors.
# Leading indentation is allowed so docs and examples that quote a dummy pass.
#
# Not path-scoped on purpose: in `gitleaks dir` (used by gate --all) an
# allowlist with `paths` skips matching files whole, even with condition AND,
# which would hide a plaintext line in a router config. An exact dummy line
# holds no secret wherever it appears, and the confcrypt layer of the gate checks
# that every dummy in a confcrypt-managed file sits under a metadata line.
#
# Keep the dummy list in step with .confcrypt.yml; the gate test
# test_every_rule_dummy_as_encrypted_line_passes fails if a dummy is missing.
[[allowlists]]
description = "confcrypt Encrypted lines: exact rule dummies and metadata lines"
regexTarget = "line"
regexes = [
  # metadata line: <comment> confcrypt v2 <base64 age blob>
  '''^\n?[ \t]*[#!] confcrypt v2 [A-Za-z0-9_-]+\r?\n?$''',
  # rsc dummies
  '''^\n?[ \t]*/user add name=REDACTED group=REDACTED password=REDACTED\r?\n?$''',
  '''^\n?[ \t]*/routing/ospf/interface-template add auth-key=REDACTED\r?\n?$''',
  '''^\n?[ \t]*/interface/wifi/security add pre-shared-key=REDACTED\r?\n?$''',
  '''^\n?[ \t]*/interface/wifi/security add passphrase=REDACTED\r?\n?$''',
  '''^\n?[ \t]*/snmp community add name=REDACTED\r?\n?$''',
  '''^\n?[ \t]*/ppp secret add name=REDACTED password=REDACTED\r?\n?$''',
  '''^\n?[ \t]*/interface/wireguard add private-key=REDACTED\r?\n?$''',
  '''^\n?[ \t]*/ip ipsec identity add secret=REDACTED\r?\n?$''',
  '''^\n?[ \t]*/radius add secret=REDACTED\r?\n?$''',
  '''^\n?[ \t]*/tool e-mail set password=REDACTED\r?\n?$''',
  '''^\n?[ \t]*# REDACTED 00:00:00:00:00:00\r?\n?$''',
  # ios dummies
  '''^\n?[ \t]*enable secret 9 REDACTED\r?\n?$''',
  '''^\n?[ \t]*username REDACTED secret 9 REDACTED\r?\n?$''',
  '''^\n?[ \t]*snmp-server community REDACTED RO\r?\n?$''',
  '''^\n?[ \t]*key-string REDACTED\r?\n?$''',
  '''^\n?[ \t]*key-hash ssh-rsa REDACTED\r?\n?$''',
  '''^\n?[ \t]*ip ospf message-digest-key 1 md5 7 REDACTED\r?\n?$''',
  '''^\n?[ \t]*password 7 REDACTED\r?\n?$''',
  '''^\n?[ \t]*crypto isakmp key REDACTED address 0\.0\.0\.0\r?\n?$''',
  '''^\n?[ \t]*tacacs-server key 7 REDACTED\r?\n?$''',
  '''^\n?[ \t]*! REDACTED 0000\.0000\.0000\r?\n?$''',
]

# Whole-token placeholders, matched against the captured value only, so a
# placeholder elsewhere on the line never hides a real value. Covers
# <PLACEHOLDER>, ${VAR} / ${var.x}, shell and PowerShell variable references
# ($VAR, $env:VAR), command substitution ($(...)), Jinja ({{ ... }}) and
# Python format fields ({name}).
# Trade-off: a real secret that is a bare `$` plus letters, digits and
# underscores (e.g. $Summer2024) reads as a variable and is not reported.
[[allowlists]]
description = "whole-token placeholders in the custom credential rules"
targetRules = ["cipassword", "routeros-password", "routeros-psk", "cisco-secret-hash", "password-not-placeholder"]
regexTarget = "secret"
regexes = [
  '''^<[^<>\s]*>$''',
  '''^\$\{[^}]*\}$''',
  '''^\$(?:env:)?[A-Za-z_][A-Za-z0-9_]*$''',
  '''^\$\(''',
  '''^\{\{''',
  '''^\{[A-Za-z_][A-Za-z0-9_.]*\}(?:\\[nrt])*$''',
]

[[allowlists]]
description = "SOPS-encrypted values (the SOPS layer of the gate checks governed files)"
regexTarget = "secret"
regexes = ['''^ENC\[AES256_GCM,data:[A-Za-z0-9+/=]+,iv:''']

# Reviewed path exceptions: one commented entry each. Each is scoped with
# targetRules to the custom rules, so gitleaks' default rules (keys, tokens)
# still scan these files.
[[allowlists]]
description = "confcrypt rule definitions: comments quote example hash shapes, dummies are inert"
targetRules = ["cipassword", "routeros-password", "routeros-psk", "cisco-secret-hash", "discord-webhook", "pushover-key", "password-not-placeholder"]
paths = ['''^Router Configs/\.confcrypt\.yml$''']

# Reviewed: the confcrypt and gate test suites hold obviously fake credential
# fixtures (FAKE*, "fake pw", runtime-generated random values) so the tools can
# be tested end to end. A path entry is used rather than inline gitleaks:allow
# because earlier commits that already hold these lines are scanned by
# `gate --all` and cannot be rewritten.
[[allowlists]]
description = "confcrypt and gate test suites: fake credential fixtures"
targetRules = ["cipassword", "routeros-password", "routeros-psk", "cisco-secret-hash", "discord-webhook", "pushover-key", "password-not-placeholder"]
paths = ['''^Scripts/(confcrypt|gate)/tests/''']

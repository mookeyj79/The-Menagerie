name: gate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  gate:
    # Stable check name for the main ruleset: "gate / gate"
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          SOPS_VERSION: 3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin"
          dl="$RUNNER_TEMP/dl"
          mkdir -p "$bin" "$dl"

          curl -fsSL -o "$dl/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dl/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dl/gitleaks.tar.gz" -C "$bin" gitleaks

          curl -fsSL -o "$bin/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  $bin/sops" | sha256sum -c -
          chmod +x "$bin/sops"

          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes --only-binary :all: \
            -r .github/gate-requirements.txt

          echo "$bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Run gate (full history and tree)
        run: sh Scripts/gate/gate.sh --all

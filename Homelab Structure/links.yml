# ============================================================================
# links.yml - Physical cabling between network devices
# ============================================================================
# Answers "what plugs into what, on which port." Holds the decided star
# (issue #64): router2 and router3 each link only to router1. A link not
# cabled that way yet carries `state: planned`, and one that goes away
# carries `state: decommissioned` until Phase 1 recables it.
#
# Schema:
#   a, b      : each end, { host, port }. host is a systems.yml hostname. port
#               is the physical port, or null if not yet confirmed.
#   medium    : direct (a cable between the two ends) | switched
#   vlans     : optional list of vlans.yml names carried on this link;
#               notes name any that runs untagged
#   confirmed : true if the owner has confirmed this link exists as described
#   state     : optional; present (default) | planned | decommissioned
#   notes     : optional
# ============================================================================

links:
  - a: { host: router1, port: null }
    b: { host: router2, port: null }
    medium: direct
    vlans: [architecture-1]
    confirmed: true

  - a: { host: router1, port: null }
    b: { host: router3, port: GigabitEthernet0/0 }
    medium: direct
    vlans: [architecture-2]
    confirmed: true
    notes: Static routes only; router3 leaves OSPF in Phase 1.

  - a: { host: router2, port: null }
    b: { host: router3, port: GigabitEthernet0/1 }
    medium: direct
    confirmed: true
    state: decommissioned
    notes: Live today on VLAN 303 (192.168.3.8/30); Phase 1 removes it, recabled last.

  - a: { host: router1, port: null }
    b: { host: switch1, port: null }
    medium: direct
    vlans: [dmz, hardware-management, server-management]
    confirmed: false
    state: planned
    notes: Router1's fourth port. Break-glass takes the fifth.

  - a: { host: switch2, port: null }
    b: { host: pve5, port: null }
    medium: direct
    confirmed: false
    state: planned
    notes: Mirror port to pve5's 1G NIC, passed through to secmon1. A mirror port can't be a trunk.

  - a: { host: ispgw1, port: null }
    b: { host: router1, port: null }
    medium: direct
    confirmed: false
    notes: The gateway sits in front of router1; the cabling has not been confirmed.

  - a: { host: switch2, port: null }
    b: { host: nvr1, port: null }
    medium: direct
    vlans: [surveillance]
    confirmed: false
    state: planned
    notes: Second stack unit, untagged in VLAN 25; the cameras plug into the same unit (issue #98). Optional upgrade.

  # Storage VLAN 26 (blog issue #613) on switch2's licensed SFP+ ports. Ports
  # 1 and 3 of each ICX 6450 are its default stacking ports and run at 10G
  # without a licence; ports 2 and 4 need the ICX6450-2X10G-LIC-POD licence.
  # Only file1 and pve5 join VLAN 26: DMZ hosts never cable to switch2 (blog #670).
  - a: { host: switch2, port: 1/2/2 }
    b: { host: file1, port: null }
    medium: direct
    vlans: [storage]
    confirmed: false
    state: planned
    notes: file1's 10G SFP+ storage port, untagged in VLAN 26. Licensed SFP+ port on the first stack unit.

  - a: { host: switch2, port: 1/2/4 }
    b: { host: pve5, port: null }
    medium: direct
    vlans: [server-management, central-servers, devops, security, app-servers, smart-home, users, storage]
    confirmed: false
    state: planned
    notes: pve5's 10G SFP+ trunk (blog #733), VLAN 102 untagged for pve5's own address on vmbr0, the VM zone VLANs and Storage tagged. Licensed SFP+ port on the first stack unit; its licence is loaded before Step 2.1.

  # RetroNet (blog issue #653): switch3, bought in Step 1.8, carries VLAN 5:
  # router3, ap2 and RetroNet's wired clients, which take its other ports untagged.
  - a: { host: router3, port: GigabitEthernet1/0 }
    b: { host: switch3, port: null }
    medium: direct
    vlans: [retronet]
    confirmed: false
    state: planned
    notes: Trunk, VLAN 5 tagged to router3's GigabitEthernet1/0.5. Step 1.8 cables it.

  - a: { host: switch3, port: null }
    b: { host: ap2, port: null }
    medium: direct
    vlans: [retronet]
    confirmed: false
    state: planned
    notes: ap2's uplink in one of its LAN ports, untagged in VLAN 5. Step 1.8 cables it.

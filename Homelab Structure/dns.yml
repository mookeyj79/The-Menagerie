# ============================================================================
# dns.yml - Single source of truth for all DNS records across all domains
# ============================================================================
# SCHEMA - domains
# ============================================================================
#
#   name        : zone name (e.g. mikewashere.lan)
#   type        : internal | external
#                   internal - served by Unbound from files generated from code
#                              (ad.mikewashere.lan by Samba AD)
#                   external - served by a cloud DNS provider; publicly routable
#   description : human-readable purpose
#   provider    : cloudflare (external only; omit for internal)
#   notes       : free-form operational notes
#
# ============================================================================
#
# SCHEMA - records
# ============================================================================
#
#   name         short kebab-case service identifier; used as the default
#                subdomain on every domain unless overridden. Use "@" for
#                the zone apex (requires explicit subdomain on every entry).
#   type         A | CNAME  (default: A; omit for standard service records)
#   ip           private IP the record resolves to on the internal domain,
#                and the Cloudflare origin IP for external proxied records.
#                Required when the record appears on any internal domain.
#                Omit only for CNAME records (use `target` instead).
#   target       CNAME target hostname, relative to the domain.
#                Required when type: CNAME; omit for A records.
#   host         cross-reference to the systems.yml hostname that ultimately
#                serves this record (the physical/VM host behind any VIP).
#                Optional but strongly encouraged; used for impact analysis
#                and documentation.
#   notes        free-form operational notes
#   split_horizon
#                optional; on a public name only. Another record whose
#                address Unbound answers for this name in house, so inside
#                and remote-user traffic never leaves the network (issue #95).
#   listed       optional boolean, default false; on a narly.ninja name only.
#                true = shown on the landing page and checked by Gatus; both
#                are generated from the listed entries (issue #127).
#   domains      one or more domain entries; see sub-schema below
#
# domains sub-schema (within a record):
#
#   Shorthand (string): the domain name as a plain string. The record `name`
#   is used as the subdomain. No Cloudflare proxy.
#
#     domains:
#       - mikewashere.lan
#       - mikewashere.com
#
#   Verbose (mapping): use when overriding the subdomain, enabling the
#   Cloudflare proxy, or setting a custom TTL.
#
#     domains:
#       - mikewashere.lan                  # shorthand; subdomain = record name
#       - domain: narly.ninja
#         subdomain: watch                 # optional; overrides record name
#         proxied: true                    # optional; boolean; default false
#         ttl: 300                         # optional; seconds; default: provider auto
#
#   Shorthand and verbose entries may be mixed freely in the same list.
#
# ============================================================================
#
# SCHEMA - zones
# ============================================================================
#
#   domain  : must match a name declared in the `domains` section
#   records : list of raw DNS records for this zone
#
# Raw record fields (canonical order):
#
#   type      A | AAAA | CNAME | MX | TXT | SRV | NS | CAA
#   name      subdomain label, or "@" for the zone apex
#   value     record value (IP for A/AAAA; hostname for CNAME/MX/NS;
#             quoted string for TXT; see RFC for SRV/CAA)
#   priority  MX or SRV priority (integer); omit for all other types
#   proxied   optional boolean; Cloudflare A/CNAME proxy; default false
#   ttl       optional integer seconds; default: provider auto
#   notes     optional free-form notes
#
# ============================================================================

domains:

  - name: mikewashere.lan
    type: internal
    description: Internal names, <app>.mikewashere.lan; served by Unbound, certificates from step-ca

  - name: mikewashere.man
    type: internal
    description: Anything reached on the Management zone; served by Unbound, certificates from step-ca

  - name: ad.mikewashere.lan
    type: internal
    description: AD DNS zone (realm AD.MIKEWASHERE.LAN); served by Samba AD, which Unbound forwards to
    notes: Records are dynamic, owned by Samba, so none are listed here.

  - name: mikewashere.com
    type: external
    provider: cloudflare
    description: 'External only: the blog and minor services; public TLS at Cloudflare''s edge'
    notes: Public records are created by OpenTofu's Cloudflare provider (issue #93); web names are proxied to Cloudflare Tunnel.

  - name: pokebob.com
    type: external
    provider: cloudflare
    description: Registered for a side project not yet started; no records or certificates until it starts

  - name: narly.ninja
    type: external
    provider: cloudflare
    description: External access to published apps; public TLS at Cloudflare's edge, Let's Encrypt on the internal proxy
    notes: |
      Public records are created by OpenTofu's Cloudflare provider from the Infra repo's public-names
      file (issues #93, #95); web names are proxied to Cloudflare Tunnel. watch, downloads, the game
      names and relay are DNS-only A records to relay1, the Linode relay (issue #148), also created by
      OpenTofu; the DDNS updater and wan are retired. Split-horizon only for the published names
      (split_horizon).

records:

# ----------------------------------------------------------------------------
# Top-Level
# ----------------------------------------------------------------------------

  - name: '@'
    domains:
    - mikewashere.com
    host: k3s-dmz1
    type: A
    notes: 'The blog, canonical name. Through Cloudflare Tunnel from Phase 8 (issue #96); until then lightsail1.'

  - name: '@'
    domains:
    - narly.ninja
    host: k3s-dmz1
    type: A
    notes: |
      The Narly.Ninja landing page (issue #127), through Cloudflare Tunnel from
      Phase 8; nothing serves it before then. No split_horizon, like the blog's
      apex. narly.ninja/status.json is routed by Traefik to Gatus.

  - name: '@'
    domains:
    - mikewashere.lan
    host: k3s-app1
    interface: eth0
    type: A
    notes: Homepage, through the internal proxy.

  - name: '@'
    domains:
    - mikewashere.man
    host: router2
    interface: VLAN101
    type: A

  - name: www
    domains:
    - mikewashere.com
    - narly.ninja
    target: '@'
    type: CNAME
    notes: Redirects to the bare domain in Traefik (the blog, issue #96; the landing page, issue #127).

  - name: downloads
    domains:
    - mikewashere.com
    host: lightsail1
    type: A
    notes: |
      The blog's downloads until they move to downloads.narly.ninja in Phase 8 (issue #116).
      Deleted with lightsail1 once the blog's 30-day rollback window has passed and a download
      through downloads.narly.ninja from outside the house matches SHA256SUMS.


# Unbound answers with the internal proxy (split-horizon)
# ----------------------------------------------------------------------------

  - name: requests
    domains:
    - narly.ninja
    host: k3s-app1
    split_horizon: proxy
    listed: true
    notes: Seerr, an ingress exception. Sign-in with the media server's accounts only.

  - name: pass
    domains:
    - narly.ninja
    host: k3s-app1
    split_horizon: proxy
    notes: Vaultwarden, an ingress exception. /admin blocked at the edge; a WAF rule limits it to the owner's country.

  - name: join
    domains:

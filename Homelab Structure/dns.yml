# ============================================================================
# dns.yml - Single source of truth for all DNS records across all domains
# ============================================================================
# SCHEMA - domains
# ============================================================================
#
#   name        : zone name (e.g. mikewashere.lan)
#   type        : internal | external
#                   internal - served by router static DNS / AdGuard; .lan only
#                   external - served by a cloud DNS provider; publicly routable
#   description : human-readable purpose
#   provider    : cloudflare (external only; omit for internal)
#   notes       : free-form operational notes
#
# ============================================================================
#
# SCHEMA - records
# ============================================================================
#
#   name         short kebab-case service identifier; used as the default
#                subdomain on every domain unless overridden. Use "@" for
#                the zone apex (requires explicit subdomain on every entry).
#   type         A | CNAME  (default: A; omit for standard service records)
#   ip           private IP the record resolves to on the internal domain,
#                and the Cloudflare origin IP for external proxied records.
#                Required when the record appears on any internal domain.
#                Omit only for CNAME records (use `target` instead).
#   target       CNAME target hostname, relative to the domain.
#                Required when type: CNAME; omit for A records.
#   host         cross-reference to the systems.yml hostname that ultimately
#                serves this record (the physical/VM host behind any VIP).
#                Optional but strongly encouraged; used for impact analysis
#                and documentation.
#   notes        free-form operational notes
#   domains      one or more domain entries; see sub-schema below
#
# domains sub-schema (within a record):
#
#   Shorthand (string): the domain name as a plain string. The record `name`
#   is used as the subdomain. No Cloudflare proxy.
#
#     domains:
#       - mikewashere.lan
#       - mikewashere.com
#
#   Verbose (mapping): use when overriding the subdomain, enabling the
#   Cloudflare proxy, or setting a custom TTL.
#
#     domains:
#       - mikewashere.lan                  # shorthand; subdomain = record name
#       - domain: narly.ninja
#         subdomain: watch                 # optional; overrides record name
#         proxied: true                    # optional; boolean; default false
#         ttl: 300                         # optional; seconds; default: provider auto
#
#   Shorthand and verbose entries may be mixed freely in the same list.
#
# ============================================================================
#
# SCHEMA - zones
# ============================================================================
#
#   domain  : must match a name declared in the `domains` section
#   records : list of raw DNS records for this zone
#
# Raw record fields (canonical order):
#
#   type      A | AAAA | CNAME | MX | TXT | SRV | NS | CAA
#   name      subdomain label, or "@" for the zone apex
#   value     record value (IP for A/AAAA; hostname for CNAME/MX/NS;
#             quoted string for TXT; see RFC for SRV/CAA)
#   priority  MX or SRV priority (integer); omit for all other types
#   proxied   optional boolean; Cloudflare A/CNAME proxy; default false
#   ttl       optional integer seconds; default: provider auto
#   notes     optional free-form notes
#
# ============================================================================

domains:
  - name: mikewashere.lan
    type: internal
    description: Internal-only zone; authoritative on Router1 static DNS, future AdGuard Home

  - name: mikewashere.man
    type: internal
    description: Management zone for infrastructure services

  - name: mikewashere.com
    type: external
    provider: cloudflare
    description: Primary public domain; contains most "legitimate", non-media content

  - name: pokebob.com
    type: external
    provider: cloudflare
    description: External site for Pokemon GTS/Mystery Gift Emulation

  - name: narly.ninja
    type: external
    provider: cloudflare
    description: Media Access Site/Game Servers; mirrors most internal services via split-horizon

records:

# ----------------------------------------------------------------------------
# Top-Level
# ----------------------------------------------------------------------------

  - name: '@'
    domains:
      - mikewashere.com
      - narly.ninja
      - pokebob.com
    host: ingress1
    interface: eth0
    type: A

  - name: '@'
    domains:
      - mikewashere.lan
    host: ingress2
    interface: eth0
    type: A

  - name: '@'
    domains:
      - mikewashere.man
    host: router2
    interface: VLAN101
    type: A


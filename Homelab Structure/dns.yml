    host: k3s-dmz1
    split_horizon: proxy
    listed: true
    notes: PsiTransfer. In house, the internal proxy forwards over app-servers-to-dmz-media.

# ----------------------------------------------------------------------------
# Relay names (issue #148): DNS-only A records to relay1's public address,
# never proxied: Cloudflare's CDN terms bar video and large files
# ----------------------------------------------------------------------------

  - name: watch
    domains:
    - narly.ninja
    host: relay1
    type: A
    split_horizon: proxy
    listed: true
    notes: |
      Jellyfin for friends. relay1's Traefik passes TLS through to k3s-dmz1's
      dedicated entrypoint (8444) over the Headscale tailnet, US only
      (Friend_Countries). In house and over the VPN, Unbound answers with the
      internal proxy, which reaches the DMZ over app-servers-to-dmz-media.

  - name: downloads
    domains:
    - narly.ninja
    host: relay1
    type: A
    split_horizon: proxy
    notes: |
      The blog's download mirror (issue #116), worldwide, through relay1 to
      the same dedicated entrypoint as watch (issue #148). On the named Let's
      Encrypt certificate with watch. In house and over the VPN, Unbound
      answers with the internal proxy, which reaches the DMZ over
      app-servers-to-dmz-media. The blog redirects /downloads/* here.

  - name: valheim
    domains:
    - narly.ninja
    host: relay1
    type: A
    notes: |
      Valheim, joined by name (issue #148); relay1 forwards UDP 2456-2457 to
      k3s-dmz1 over the tailnet. Exists only while the game is deployed: the
      record and the relay route are added and removed in the same change. No
      split_horizon, so players in house go out through the relay too.

  - name: v-rising
    domains:
    - narly.ninja
    host: relay1
    type: A
    notes: Like valheim, for V Rising on UDP 9876-9877.

  - name: relay
    domains:
    - narly.ninja
    host: relay1
    type: A
    notes: |
      Headscale's control URL, sharing relay1's 443 under its own name

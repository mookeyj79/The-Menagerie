  # ==========================================================================

  - hostname: ha1
    description: Home Assistant OS; the smart home hub
    host: pve5
    interfaces:
      - name: eth0
        ip_address: 192.168.24.2
        vlan: smart-home
    notes: |
      An appliance: updates itself over Smart Home's internet, not Ansible-managed. One network
      leg only, because device discovery is multicast and doesn't cross VLANs. No radios; a ZBT-2
      or ZWA-2 USB stick on pve5 is passed through if Zigbee, Thread or Z-Wave devices are bought.
      Users reach it only through the internal proxy (ha.mikewashere.lan), with its own login and
      TOTP. Backed up by pve5's vzdump to file1; in the Restore set. The Home Assistant Green is
      the optional upgrade that moves it off pve5.
    os: Home Assistant OS
    resources:
      arch: x86_64
      cpu: 2
      ram_gb: 4
      storage_gb: 32
    role: server
    state: planned
    type: vm

  - hostname: tailgw1
    ansible_roles: [common, tailscale]
    description: Remote-user gateway; Tailscale subnet router for family and the owner's user devices
    host: pve5
    interfaces:
      - name: eth0
        ip_address: 192.168.20.2
        vlan: users
      - name: tailscale0
        description: Household tailnet; address assigned by Tailscale
    notes: |
      Issue #146, Phase 8 with the apps it serves. Advertises only the resolvers, Authelia and the
      internal proxy (App_Nodes 443) as subnet routes; address translation is off, so remote users
      keep their 100.64.0.0/10 addresses (Remote_Users) and router2 routes that range back here.
      The router rules remote-users-* and Authelia's two-factor check apply unchanged. Users zone,
      so its own Tailscale traffic leaves through internet-any. Forwards only tailscale0 to eth0
      for those destinations. Admin laptops never use it. If pve5 is down, remote-user access is
      down (accepted in issue #81). RAM taken from k3s-app1.
    os: Debian 13
    resources:
      arch: x86_64
      cpu: 1
      ram_gb: 1
      storage_gb: 8
    role: server
    state: planned
    type: vm

  - hostname: nvr1

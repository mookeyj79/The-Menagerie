    description: NVR host; Frigate and Mosquitto for the cameras
    hardware: Intel N100/N150-class mini PC
    interfaces:
      - name: eth0
        ip_address: 192.168.25.2
        vlan: surveillance
    notes: |
      Part of the Surveillance bundle, an optional upgrade (4 PoE cameras, this host, a 2 TB SSD);
      nothing here exists until it is bought. A managed Debian host: bastions and runners SSH in,
      CrowdSec and log shipping run on it. Frigate uses OpenVINO on the iGPU for detection and
      VAAPI for decoding; web push, version check and Frigate+ off. Motion-only recording, 14 days
      of motion and 30 days of alerts on the local SSD; recordings are disposable. restic pushes
      /media/frigate/exports (saved clips) only, append-only, to file1's REST server. The one
      Surveillance machine with named outbound.
      CPU is the N100's four cores; RAM is a placeholder until the bundle is priced.
    os: Debian 13
    owned: false
    resources:
      arch: x86_64
      cpu: 4
      ram_gb: 16
      storage_gb: 2048
    role: server
    state: planned
    type: physical


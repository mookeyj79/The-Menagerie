  # ==========================================================================
  # Offsite
  # ==========================================================================

  - hostname: backup1
    description: Tier-3 offsite backup; optional upgrade
    hardware: QNAP TS-364
    interfaces:
      - name: tailscale0
        description: Household tailnet via the TrueNAS Tailscale app; address assigned by Tailscale
        state: planned
    notes: |
      Not owned. First on the backup purchase list. Until then Backblaze B2 is the only offsite
      copy. Sits at a second site (such as a relative's house) with no port forwarding there and
      no VLAN, and joins the household tailnet through the TrueNAS Tailscale app (issue #146,
      Phase 3). The tailnet access rules allow file1 to its append-only restic REST server port
      and bastion1 to its SSH and web UI, nothing else; backup1 starts nothing toward home. It
      runs its own prune and ZFS snapshots, so a compromised house can't erase its copy. TrueNAS
      has no host firewall, so the access rules are its only filter on the tailnet.
    os: TrueNAS Scale 25
    owned: false
    resources:
      arch: x86_64
      cpu: 4
      ram_gb: 8
      storage_gb: 128
    role: server
    state: planned
    type: physical

  - hostname: lightsail1
    description: AWS Lightsail instance serving the blog and its downloads today
    notes: |
      Not in the homelab: no VLAN, interfaces or firewall rules, and not in the target design
      (issue #148). publish.ps1 deploys to it over SSH until the GitHub Action replaces it
      (issue #117). Serves the blog until it moves to the DMZ cluster (Phase 8 or earlier, through
      the tunnel; issues #96, #148) and the downloads until they move to the relay. Deleted, with
      downloads.mikewashere.com, once the blog's 30-day rollback window has passed and a download
      through downloads.narly.ninja (via relay1) from outside the house matches SHA256SUMS
      (issue #116).
    role: server
    state: present
    type: vm


# ============================================================================
# systems.yml - Single source of truth for every host and network device
# ============================================================================
# Holds the decided architecture (wayfinder map, issue #61). Live state is
# kept apart: a device in service is `state: present`, but an interface it
# does not run yet is `state: planned`, and what a router runs today until
# Phase 1 rebuilds the network is in its `live:` note.
#
# Schema:
#   hostname        short identifier, unique across the fleet
#   ansible_roles   list of Ansible roles applied ON TOP of the base image
#   description     one-line human-readable purpose
#   hardware        model of off-the-shelf hardware
#   host            parent hypervisor hostname or group name (type: vm only)
#   interfaces      list of { name, ip_address, vlan, description, state }
#   live            what a present device runs today that differs from the
#                   design; removed once Phase 1 makes it match
#   notes           operational notes; block scalar `|` for multi-line
#   os              OS identifier (e.g. Debian 13, routeros-7)
#   owned           true | false | unknown (physical devices only)
#   resources       { arch, cpu, ram_gb, storage_gb, gpu }
#   role            broad function (hypervisor, router, server, identity, ...)
#   state           present | planned | decommissioned
#   tags            optional free-form labels (e.g. ai_ml)
#   type            physical | vm | lxc | network_device | appliance
#
# Field semantics:
#
#   ansible_roles:
#     Order-significant. Place dependencies first (common before docker_host
#     before service-specific). Excludes roles baked into the base image;
#     only role-specific additions appear here.
#
#   host:
#     Reference to a hostname or group name defined in the `groups` block.
#     Only valid on type: vm entries. Omit for physical hosts.
#
#   interfaces[].state:
#     Optional; defaults to the system's state. `planned` on a present device
#     means the device does not run this interface yet.
#
#   owned:
#     Whether the hardware is physically owned today. Independent of state: a
#     device can be owned but not yet in use. `owned: false` is the shopping
#     list, never an assumption.
#
#   state:
#     present        - exists, managed (Ansible targets it)
#     planned        - declared but not yet built (Tofu sees it, Ansible skips)
#     decommissioned - retired by a decision; kept so older docs that name it
#                      still resolve. Carries no interfaces and is excluded
#                      from rendering.
# ============================================================================

groups:
  - name: pve-dmz
    description: Proxmox cluster for the DMZ side (one cluster per side, never joined).
    hosts: [pve1, pve2, pve3, pve4]
  - name: pve-internal
    description: Proxmox cluster for the internal side.
    hosts: [pve5, pve6, pve7]

systems:

  # ==========================================================================
  # Network Devices
  # ==========================================================================

  - hostname: ap1
    description: Internal Wi-Fi access point; standalone, configured by hand
    hardware: TpLink EAP610
    interfaces:
      - name: main
        ip_address: 10.0.1.20
        vlan: hardware-management
    notes: |
      Carries four tagged networks: Users, Guest, Smart Home and Fabrication, each with its own
      password and no RADIUS. Client isolation on Guest and Smart Home. No Omada controller.
    os: Omada 1.6.0
    owned: true
    role: ap
    state: present
    type: network_device

  - hostname: ap2
    description: RetroNet Wi-Fi access point; untrusted, managed through the bastion
    hardware: Linksys MR8300
    interfaces:
      - name: main
        ip_address: 192.168.5.3
        vlan: retronet
    notes: Owned; whether it is in service is not confirmed. No interface in Management.
    os: OpenWrt 25
    owned: true
    role: ap
    state: planned
    type: network_device

  - hostname: pdu1
    description: Switched PDU; NUT drives its outlets for the start order
    hardware: APC AP7901
    interfaces:
      - name: main
        ip_address: 10.0.3.3
        vlan: power-management
    os: AOS 3.9.4
    owned: true
    role: pdu
    state: present
    type: network_device

  - hostname: switch1
    description: DMZ switch; layer 2 only, no link to the internal switches
    hardware: Brocade ICX 6610
    interfaces:
      - name: management
        ip_address: 10.0.1.2
        vlan: hardware-management
    notes: A PoE model (owner, 2026-11-10).
    os: FastIron OS 08.0.30u
    owned: true
    role: switch
    state: present
    type: network_device

  - hostname: switch2
    description: Internal switch; mirrors eight VLANs to Security Onion
    hardware: Brocade ICX 6450 x2 (stacked)
    interfaces:
      - name: management
        ip_address: 10.0.1.18
        vlan: hardware-management
    notes: |
      Mirrors incoming traffic on central-servers, app-servers, devops, users, guest, devices,
      fabrication and smart-home to one port cabled to pve5's 1G NIC (issue #71). VLAN mirroring on
      the 6450 is an early proof; the fallback mirrors router2's port. The second stack unit has
      24 ports set aside for Surveillance: the cameras and nvr1, untagged in VLAN 25 (owner,
      2026-11-10; issue #123). Both stack units are PoE models, so the cameras need no
      injectors (owner, 2026-11-10). Surveillance is not mirrored.
    os: FastIron OS 08.0.30u
    owned: true
    role: switch
    state: present
    type: network_device

  - hostname: switch3
    description: RetroNet switch; untrusted, managed through the bastion
    hardware: Zyxel GS-1900-24
    interfaces:
      - name: management
        ip_address: 192.168.5.4
        vlan: retronet
    os: OpenWrt 25
    owned: false
    role: switch
    state: planned
    type: network_device

  - hostname: switch4
    description: Netgear PoE switch
    hardware: Netgear GS108PE
    interfaces:
      - name: management
        ip_address: 10.0.1.19
        vlan: hardware-management
    os: Netgear FW 2.06.24
    owned: true
    role: switch
    state: present
    type: network_device

  - hostname: router1
    description: Edge router and hub of the star; DMZ gateway, all NAT, no inbound ports
    hardware: MikroTik Hex
    interfaces:
      - name: external_bridge
        ip_address: 192.168.2.2
        description: Internet side, behind ispgw1 in passthrough; IPv6 off
      - name: VLAN101
        ip_address: 10.0.1.1
        vlan: hardware-management
      - name: VLAN102
        ip_address: 10.0.2.1
        vlan: server-management
      - name: VLAN301
        ip_address: 192.168.3.1
        vlan: architecture-1
      - name: VLAN302
        ip_address: 192.168.3.5
        vlan: architecture-2
      - name: VLAN4
        ip_address: 192.168.4.1
        vlan: dmz
      - name: break-glass
        ip_address: 10.9.11.1
        description: Off-bridge port on 10.9.11.0/29, never routed; reaches only this router
        state: planned
    live: |
      Runs the pre-#64 config: its VLAN302 link still joins OSPF with router3, and it has no
      default-deny policy or break-glass port yet.
    notes: |
      Nothing listens or forwards on the WAN side: every path in is dialed out from inside (issues
      #146, #148). Remote access is the household tailnet, not WireGuard here, and its traffic
      reaches router1 only as outbound UDP from bastion1, file1 and tailgw1.
      OSPF router-id 192.168.254.1 with router2 only; originates the default route. Static route to
      RetroNet via router3. Enforces the RetroNet outbound allowlist. Five ports: ispgw1, router2,
      router3, switch1 and break-glass.
    os: RouterOS 7
    owned: true
    role: router
    state: present
    type: network_device

  - hostname: router2
    description: Internal router; gateway for every zone except DMZ and RetroNet
    hardware: MikroTik Hex
    interfaces:
      - name: VLAN101
        ip_address: 10.0.1.17
        vlan: hardware-management
      - name: VLAN102
        ip_address: 10.0.2.17
        vlan: server-management
      - name: VLAN103
        ip_address: 10.0.3.1
        vlan: power-management
      - name: VLAN301
        ip_address: 192.168.3.2
        vlan: architecture-1
      - name: VLAN16
        ip_address: 192.168.16.1
        vlan: central-servers
        state: planned
      - name: VLAN17
        ip_address: 192.168.17.1
        vlan: app-servers
        state: planned
      - name: VLAN18
        ip_address: 192.168.18.1
        vlan: devops
        state: planned
      - name: VLAN19
        ip_address: 192.168.19.1
        vlan: security
        state: planned
      - name: VLAN20
        ip_address: 192.168.20.1
        vlan: users
        state: planned
      - name: VLAN21
        ip_address: 192.168.21.1
        vlan: guest
        state: planned
      - name: VLAN22
        ip_address: 192.168.22.1
        vlan: devices
        state: planned
      - name: VLAN23
        ip_address: 192.168.23.1
        vlan: fabrication
        state: planned
      - name: VLAN24
        ip_address: 192.168.24.1
        vlan: smart-home
        state: planned
      - name: VLAN25
        ip_address: 192.168.25.1
        vlan: surveillance
        state: planned
      - name: break-glass
        ip_address: 10.9.11.1
        description: Off-bridge port on 10.9.11.0/29, never routed; reaches only this router
        state: planned
    live: |
      Runs the pre-#64 VLANs: 16 internal-servers, 17 internal-users, 18 internal-guests,
      19 internal-smarthome, 20 internal-devices, 22 internal-surveillance and 23 internal-devops,
      plus VLAN303 (192.168.3.9/30) to router3. Phase 1 renumbers them in place and recables the
      router2-router3 link last.
    notes: |
      OSPF router-id 192.168.254.2.
      Static route for 100.64.0.0/10 (the household tailnet, Remote_Users) via tailgw1 at
      192.168.20.2, kept out of OSPF so router1 never learns it (issue #146). Accepts that source
      only arriving on VLAN20 from tailgw1; from anywhere else it is spoofed and dropped.
    os: RouterOS 7
    owned: true
    role: router
    state: present
    type: network_device

  - hostname: router3
    description: Cisco 3825; RetroNet gateway and dial-up only; untrusted
    hardware: Cisco 3825
    interfaces:
      - name: GigabitEthernet0/0.302
        ip_address: 192.168.3.6
        vlan: architecture-2
      - name: GigabitEthernet1/0.5
        ip_address: 192.168.5.1
        vlan: retronet
        description: RetroNet
        state: planned
    live: |
      Runs OSPF with Loopback0 192.168.254.3, a Management leg (FastEthernet2/0.101, 10.0.1.33),
      a link to router2 (GigabitEthernet0/1.303, 192.168.3.10), a Smart Home subnet
      (GigabitEthernet1/0.19, 192.168.19.65/28) and RetroNet as VLAN 21 (192.168.21.1/26).
    notes: |
      Has both FXO and FXS ports for dial-up. Out of OSPF with a static default; no NAT. Reached by
      the bastion only over the routed path through router1; nothing from it back except replies.
      Console over RS-232. IOS out of support since 2016, so treated as untrusted.
    os: Cisco IOS 15.1(4)m12a
    owned: true
    role: router
    state: present
    type: network_device

  # ==========================================================================
  # Firewalls (optional upgrades)
  # ==========================================================================

  - hostname: fw1
    description: Optional faster replacement for router1
    hardware: Protectli Vault VP2440e
    interfaces:
      - name: management
        ip_address: 10.0.1.3
        vlan: hardware-management
    notes: Bought only if the router throughput proof fails. The VP2440 is discontinued; the VP2440e replaces it. OS chosen when bought.
    owned: false
    role: firewall
    state: planned
    type: network_device

  - hostname: fw2
    description: Optional faster replacement for router2
    hardware: Protectli Vault VP2440e
    interfaces:
      - name: management
        ip_address: 10.0.1.21
        vlan: hardware-management
    notes: Bought only if the router throughput proof fails. OS chosen when bought.
    owned: false
    role: firewall
    state: planned
    type: network_device

  # ==========================================================================
  # Physical Servers
  # ==========================================================================

  - hostname: bastion1
    ansible_roles: [common_arm, bastion]
    description: The only admin path; SSH with step-ca certificates, tunnelling onward
    hardware: Raspberry Pi 5
    interfaces:
      - name: eth0.101
        ip_address: 10.0.1.22
        vlan: hardware-management
        description: The address admins in Users SSH to
      - name: eth0.102
        ip_address: 10.0.2.23
        vlan: server-management
      - name: eth0.103
        ip_address: 10.0.3.4
        vlan: power-management
      - name: tailscale0
        description: Household tailnet (hosted Tailscale); remote admins SSH here; address assigned by Tailscale
        state: planned
    notes: |
      The owner's spare Pi 5. Doesn't forward between legs and runs a host firewall. Its own legs
      reach router2-side devices when router2 is down. If SSH fails, the owner uses the console
      cable directly. RAM not confirmed.
      Remote admin access (issue #146): Tailscale runs on bastion1 itself and dials out (rules
      household-tailnet-*). The tailnet access rules let only the owner's admin laptops reach its
      SSH; admin traffic arrives inside the tunnel, so no router filters it, and the host firewall
      on tailscale0 accepts TCP 22 only. Not a subnet router; Tailscale SSH off. Tailnet Lock is
      signed from bastion1 and the owner's admin laptop. bastion1 also reaches backup1's SSH and
      web UI over the tailnet. The path needs router1 (outbound), bastion1 and Tailscale's service,
      not SSO, file1 or pve5.
    os: Raspbian Lite
    owned: true
    resources:
      arch: arm64
      cpu: 4
      ram_gb: TBD
      storage_gb: 128
    role: server
    state: planned
    type: physical

  - hostname: file1
    description: TrueNAS file server, shared databases and backup hub
    hardware: Dell PowerEdge R730xd
    interfaces:
      - name: eth0.16
        ip_address: 192.168.16.6
        vlan: central-servers
        description: Web UI and SSH (only here); routed, router-filtered file, database and REST-server exceptions
      - name: storage
        ip_address: 192.168.26.2
        vlan: storage
        description: 10G for App-Servers; SMB, NFS, database apps and the restic REST server listen here, never the UI or SSH
      - name: idrac
        ip_address: 10.0.2.22
        vlan: server-management
      - name: tailscale0
        description: Household tailnet via the TrueNAS Tailscale app; outbound to backup1 only; address assigned by Tailscale
        state: planned
    notes: |
      Household tailnet (issue #146, Phase 3, with backup1): the TrueNAS Tailscale app dials out
      (rules household-tailnet-*) and pushes a second restic copy of the Restore set to backup1's
      append-only REST server. The tailnet access rules allow nothing in to file1; with no host
      firewall, they are its only filter on that interface. Not a subnet router.
      Runs TrueNAS and, as TrueNAS apps, shared Postgres 18, Redis and InfluxDB, a second Unbound
      and chrony, the iDRAC fan controller and the restic REST server (append-only). It hosts no VMs.
      Exports the library and downloads datasets read-only to k3s-dmz1 (issues #107, #116).
      Protected by binding, not a host firewall (issues #83, #107): file services listen on both
      interfaces, the UI and SSH on Central-Servers only, and the routers filter the Central-Servers
      side. Pushes the Restore set to Backblaze B2.
      GitLab backups (issue #187): one account each for the GitLab backup and the repo export, each
      logging in over SSH and limited by rrsync to writing its own folder, so no client can delete.
      Each night lands in its own dated folder; a job on file1 keeps the last 7 nights and deletes
      older ones. ZFS snapshots and the B2 retention (issue #72) apply on top.
      Data disks: 8x 10 TB in RAIDZ2. Boot on the ~256 GB SSD; the 128 GB SSD is a SLOG.
      NICs: 2x 10G SFP+ plus the original Ethernet NICs (count not confirmed).
    os: TrueNAS Scale 25
    owned: true
    resources:
      arch: x86_64
      cpu: 16
      ram_gb: 64
      storage_gb: 256
    role: server
    state: present
    type: physical

  - hostname: dns2
    ansible_roles: [common_arm, unbound, chrony]
    description: Second resolver and time server; optional upgrade
    hardware: Raspberry Pi 5
    interfaces:
      - name: eth0
        ip_address: 192.168.16.8
        vlan: central-servers
    notes: Replaces the second Unbound and chrony on file1 once bought.
    os: Raspbian Lite
    owned: false
    resources:
      arch: arm64
      cpu: 4
      ram_gb: 4
      storage_gb: 32
    role: server
    state: planned
    type: physical

  - hostname: ml1
    ansible_roles: [common, nvidia_runtime]
    description: AI/ML GPU server; late-stage
    notes: |
      Planned as an NVIDIA GPU server, possibly a new dedicated build; specs below are placeholders.
      The old mining rig (six AMD GPUs, status unknown) is not counted as available compute. Its
      zone and address aren't decided.
    os: Debian 13
    owned: false
    resources:
      arch: x86_64
      cpu: TBD
      gpu: TBD
      ram_gb: TBD
      storage_gb: TBD
    role: server
    state: planned
    type: physical

  - hostname: nut1
    ansible_roles: [common_arm, nut_server]
    description: NUT, PeaNUT and the start order
    hardware: Raspberry Pi 3
    interfaces:
      - name: eth0.103
        ip_address: 10.0.3.2
        vlan: power-management
    notes: |
      USB to ups1. Runs the start order: PDU outlets for power, a Proxmox token limited to starting
      and stopping VMs on pve5 plus the read-only guest-agent permission, and a health check on
      each stage: the VM's guest agent answering through that API, falling back to the stage's
      timeout (issue #187). Chosen because it doesn't need a PoE HAT. RAM not confirmed.
    os: Raspbian Lite
    owned: true
    resources:
      arch: arm64
      cpu: 4
      ram_gb: 1
      storage_gb: 128
    role: infrastructure
    state: present
    type: physical

  # ==========================================================================
  # Hypervisors
  # ==========================================================================

  - hostname: pve1
    ansible_roles: [common, proxmox_host]
    description: DMZ Proxmox hypervisor; carries the DMZ K3s node
    hardware: Custom build
    interfaces:
      - name: eth0.102
        ip_address: 10.0.2.2
        vlan: server-management
    notes: 1 TB SSD, 1x 1G Ethernet; a 10G SFP+ NIC is planned, not owned. May be replaced by an M720Q someday.
    os: Proxmox VE 9
    owned: true
    resources:
      arch: x86_64
      cpu: 4
      ram_gb: 16
      storage_gb: 1024
    role: hypervisor
    state: present
    type: physical

  - hostname: pve2
    ansible_roles: [common, proxmox_host]
    description: DMZ Proxmox hypervisor; optional upgrade
    hardware: Lenovo ThinkCentre M720Q
    interfaces:
      - name: eth0.102
        ip_address: 10.0.2.3
        vlan: server-management
    notes: Bought if public game servers don't fit pve1.
    os: Proxmox VE 9
    owned: false
    resources:
      arch: x86_64
      cpu: 6
      ram_gb: 32
      storage_gb: 512
    role: hypervisor
    state: planned
    type: physical

  - hostname: pve3
    ansible_roles: [common, proxmox_host]
    description: DMZ Proxmox hypervisor; optional upgrade
    hardware: Lenovo ThinkCentre M720Q
    interfaces:
      - name: eth0.102
        ip_address: 10.0.2.4
        vlan: server-management
    os: Proxmox VE 9
    owned: false
    resources:
      arch: x86_64
      cpu: 6
      ram_gb: 32
      storage_gb: 512
    role: hypervisor
    state: planned
    type: physical

  - hostname: pve4
    ansible_roles: [common, proxmox_host]
    description: DMZ Proxmox hypervisor; optional upgrade
    hardware: Lenovo ThinkCentre M720Q
    interfaces:
      - name: eth0.102
        ip_address: 10.0.2.5
        vlan: server-management
    os: Proxmox VE 9
    owned: false
    resources:
      arch: x86_64
      cpu: 6
      ram_gb: 32
      storage_gb: 512
    role: hypervisor
    state: planned
    type: physical

  - hostname: pve5
    ansible_roles: [common, proxmox_host]
    description: Internal Proxmox hypervisor; carries Central-Servers, DevOps, Security, App-Servers, Smart Home and the Users gateway
    hardware: Custom build
    interfaces:
      - name: eth0.102
        ip_address: 10.0.2.18
        vlan: server-management
      - name: mirror
        description: 1G NIC cabled to switch2's mirror port; PCI passthrough to secmon1, no host address
        state: planned
    notes: |
      2 TB SSD, 1x 10G SFP+ and 1x 1G Ethernet. 8 GB for the host and 115 GB for VMs, leaving
      5 GB free after crowdsec1 shrank (issue #71); 45 vCPUs on 24 threads, deliberately
      overcommitted. Tags the Smart Home VLAN (24) to ha1 only (issue #98) and the
      Users VLAN (20) to tailgw1 only (issue #146). A pve5 failure loses five zones and
      remote-user access; accepted.
    os: Proxmox VE 9
    owned: true
    resources:
      arch: x86_64
      cpu: 24
      ram_gb: 128
      storage_gb: 2048
    role: hypervisor
    state: present
    type: physical

  - hostname: pve6
    ansible_roles: [common, proxmox_host]
    description: Internal Proxmox hypervisor; optional upgrade
    hardware: Lenovo ThinkCentre M920Q
    interfaces:
      - name: eth0.102
        ip_address: 10.0.2.19
        vlan: server-management
    os: Proxmox VE 9
    owned: false
    resources:
      arch: x86_64
      cpu: 8
      ram_gb: 64
      storage_gb: 1024
    role: hypervisor
    state: planned
    type: physical

  - hostname: pve7
    ansible_roles: [common, proxmox_host]
    description: Internal Proxmox hypervisor; optional upgrade
    hardware: Lenovo ThinkCentre M920Q
    interfaces:
      - name: eth0.102
        ip_address: 10.0.2.20
        vlan: server-management
    os: Proxmox VE 9
    owned: false
    resources:
      arch: x86_64
      cpu: 8
      ram_gb: 64
      storage_gb: 1024
    role: hypervisor
    state: planned
    type: physical

  # ==========================================================================
  # DMZ
  # ==========================================================================

  - hostname: k3s-dmz1
    ansible_roles: [common, k3s_server, tailscale]
    description: DMZ K3s cluster node (server)
    host: pve1
    interfaces:
      - name: eth0
        ip_address: 192.168.4.2
        vlan: dmz
      - name: tailscale0
        description: The relay's Headscale tailnet, dialed out to relay1; address assigned by Headscale
    notes: |
      Runs the public entry point, the blog, the download mirror, Jellyfin, Valheim, V Rising, Foundry, AutoMuteUs
      and Galactus. Managed by Argo CD in the App-Servers cluster; secrets arrive from a pipeline job.
      Its Tailscale client (Ansible, on the host, not in the cluster) joins relay1's Headscale tailnet
      over dmz-to-relay (issue #148); relay1's Traefik reaches the dedicated entrypoint (8444) and the
      game ports at the tailscale0 address. The host firewall on tailscale0 accepts only those ports
      from relay1. This tailnet is separate from the household Tailscale tailnet (issue #146).
    os: Debian 13
    resources:
      arch: x86_64
      cpu: 4
      ram_gb: 14
      storage_gb: 900
    role: server
    state: planned
    type: vm

  - hostname: relay1
    ansible_roles: [common, traefik, headscale]
    description: Linode VPS relaying watch, downloads and game servers to k3s-dmz1; a DMZ host
    notes: |
      Issue #148. Not in the house: no VLAN; Linode assigns its public address, held in the Relay
      group. Created by OpenTofu's Linode provider (the $5 plan, 1 TB transfer, $0.005/GB over;
      issue #145) and managed by Ansible like any DMZ host, with the same protections, log shipping
      and metrics. Not a K3s node. Traefik routes by SNI with TLS passthrough, so it holds no app
      certificates and sees no clear text; PROXY protocol carries the visitor's IP to home Traefik.
      watch is limited to Friend_Countries by a TCP IPAllowList rendered monthly; downloads and the
      game servers are open to all; game UDP rides Traefik UDP routers. CrowdSec with the firewall
      bouncer covers every port. Headscale runs the relay's own tailnet, its control traffic sharing
      443 under its own name; its ACL lets relay1 reach only k3s-dmz1's entrypoint and game ports.
      Host firewall: TCP 443, UDP 41641 (Tailscale) and the deployed games' UDP ports, nothing else
      public. Linode's web console is the way in if the link fails. How runners, bastion1,
      Prometheus, Security Onion and the CrowdSec LAPI reach it is open (issue #156).
      Deployed in Phase 8 with the first service that needs it. When Linode is down, watch,
      downloads and the games are down; the blog and admin access are not.
    os: Debian 13
    resources:
      arch: x86_64
      cpu: 1
      ram_gb: 1
      storage_gb: 25

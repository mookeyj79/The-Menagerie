# ============================================================================
# fw_rules.yml - Network policy (RouterOS filter chains + Cisco ACLs)
# ============================================================================
# Answers "which source can reach which destination, on what, permit or
# deny." References fw_groups.yml names for src/dst.
#
# The decided policy from "How zones are enforced" (issue #64) and the
# named exceptions later tickets added. Stateful and deny by default; each
# rule is enforced on every router the traffic crosses. Ansible also renders
# these into default-deny inbound nftables on each managed Linux host
# (issue #83). Rule order is significant: first match wins, so every
# internal accept sits above drop-unlisted-private and the egress rules.
# Ports not fixed by a ticket are vendor defaults, set per service at build.
#
# ============================================================================
# Schema
# ============================================================================
#
#   name        : kebab-case unique identifier
#   description : optional one-line purpose
#   src         : fw_groups.yml name, list of names, or the literal keyword
#                 "any". A literal CIDR is also valid for narrow self-
#                 protection cases (see input-accept-loopback).
#   dst         : same value rules as src; omit for self/router-destined
#                 rules (those use chain: input instead)
#   protocol    : tcp | udp | icmp | ospf | any - always a single value,
#                 never a list. Split multi-protocol policy into separate
#                 rules (see router3-retronet-dhcp / -icmp for the
#                 pattern).
#   ports       : list of dst ports. Each entry is an int, or a string
#                 "N-M" for a range (see sunshine-stream-udp).
#   src_ports   : optional; list of source ports, same forms as ports
#   action      : accept | drop | fasttrack
#                   - fasttrack: RouterOS fasttrack-connection; matching
#                     connections then skip the rules, queues and counters
#                     below, so it carries no src/dst of its own and any
#                     connection that must keep its queues is accepted
#                     above it
#   chain       : input | forward
#                   - input:   traffic destined FOR the router itself
#                   - forward: traffic routed THROUGH the router
#   applies_to  : list of systems.yml router hostnames this rule renders on
#   family      : optional; ipv4 (default) | ipv6. ipv6 renders into the
#                 router's IPv6 firewall.
#   connection_state : optional; list of new | established | related |
#                 invalid | untracked. Omitted, the rule matches any state.
#   in_interface_list  : optional; interface list the traffic arrives on.
#   out_interface_list : optional; interface list the traffic leaves by.
#                 Both name a list in systems.yml `interface_lists`, which
#                 every router in applies_to must have (WAN: the router's
#                 interfaces toward the internet).
#   log         : optional; true logs every packet the rule matches
#   dnat        : optional; a port forward. Only on a forward-chain accept
#                 with protocol tcp or udp and ports. The router also
#                 renders a dst-nat rule for the same protocol and ports,
#                 and this accept matches only connections it forwarded
#                 (connection-nat-state=dstnat), so the forward and its
#                 accept live in one entry. The rule must sit above
#                 drop-unlisted-private, because after dst-nat the
#                 destination is a private address.
#                   in_interface_list : interface list the traffic arrives
#                                       on (WAN)
#                   to                : systems.yml hostname the traffic is
#                                       forwarded to; must be a host member
#                                       of a dst group
#                   to_port           : optional; the port on `to` when it
#                                       differs from the public port. The
#                                       dst-nat rewrites the port, and the
#                                       accept matches the rewritten port.
#   notes       : optional; prose for readers only. No renderer reads it:
#                 everything a rule matches is in the fields above
#                 (blog issue #628).
#
# Groups are never negated (no !Group): an empty list negated would match
# everything. A group whose hosts are planned or have no address yet renders
# as an empty list, so its rules match nothing until the host exists.
#
# No rule uses dnat today: the house has zero inbound ports (issue #148), and
# public traffic arrives over Cloudflare Tunnel or the Linode relay.
#
# ============================================================================

rules:

  # ==========================================================================
  # Router self-protection (input chain)
  # ==========================================================================

  - name: input-drop-invalid
    src: any
    protocol: any
    action: drop
    chain: input
    applies_to: [router1, router2]
    connection_state: [invalid]

  - name: input-accept-established
    src: any
    protocol: any
    action: accept
    chain: input
    applies_to: [router1, router2]
    connection_state: [established, related, untracked]

  - name: input-accept-loopback
    src: any
    dst: 127.0.0.0/8
    protocol: any
    action: accept
    chain: input
    applies_to: [router1, router2]

  - name: input-block-wan-dns-relay
    src: any
    protocol: udp
    ports: [53]
    action: drop
    chain: input
    applies_to: [router1]
    in_interface_list: WAN

  - name: client-zone-dhcp
    description: DHCP from each client zone's gateway router
    src: [Users, Guest, Devices, Smart_Home, Surveillance]
    protocol: udp
    ports: [67]
    action: accept
    chain: input
    applies_to: [router2]

  - name: admin-to-router-services
    description: SSH and HTTPS (WebFig) on the routers, from the bastion and break-glass only
    src: [Bastions, Emergency_Console_Access]
    protocol: tcp
    ports: [22, 443]
    action: accept
    chain: input
    applies_to: [router1, router2]

  - name: devops-router-api
    description: RouterOS API over TLS for the pipeline
    src: Runners
    protocol: tcp
    ports: [8729]
    action: accept
    chain: input
    applies_to: [router1, router2]

  - name: metrics-router-api
    description: The RouterOS exporter on metrics1 reads each router's API over TLS
    src: Metrics
    protocol: tcp
    ports: [8729]
    action: accept
    chain: input
    applies_to: [router1, router2]
    notes: Issue #187. The exporter runs on metrics1 and Prometheus scrapes it locally; nothing listens for scrapes on the routers.

  - name: ospf-on-architecture
    src: Architecture
    protocol: ospf
    action: accept
    chain: input
    applies_to: [router1, router2]
    notes: Authenticated OSPF on architecture-1 only; zone VLANs are passive and router3 is not a neighbour.

  - name: input-accept-icmp
    src: any
    protocol: icmp
    action: accept
    chain: input
    applies_to: [router1, router2]
    notes: |
      No rate limit: MikroTik's manual calls one unnecessary in most cases,
      since the Linux kernel already limits ICMP to 100 packets a second.
      There is no port-scan rule either: every input accept above names its
      sources, so a scanner reaches nothing (blog issue #628).

  - name: input-final-drop
    src: any
    protocol: any
    action: drop
    chain: input
    applies_to: [router1, router2]

  # ==========================================================================
  # Forward baseline
  # ==========================================================================

  - name: forward-drop-invalid
    src: any
    protocol: any
    action: drop
    chain: forward
    applies_to: [router1, router2]
    connection_state: [invalid]

  - name: forward-accept-established-queued-from
    description: RetroNet and Guest skip FastTrack on router1, so their queues still apply
    src: [RetroNet, Guest]
    protocol: any
    action: accept
    chain: forward
    applies_to: [router1]
    connection_state: [established, related]
    notes: Issue #64. FastTrack marks the whole connection, so the replies need forward-accept-established-queued-to as well.

  - name: forward-accept-established-queued-to
    description: Replies to RetroNet and Guest, kept off FastTrack on router1
    src: any
    dst: [RetroNet, Guest]
    protocol: any
    action: accept
    chain: forward
    applies_to: [router1]
    connection_state: [established, related]

  - name: forward-fasttrack
    description: Allowed connections skip the rules after their first packets
    src: any
    protocol: any
    action: fasttrack
    chain: forward
    applies_to: [router1, router2]
    connection_state: [established, related]
    notes: Issue #64. Guest is fast-tracked on router2; only router1 keeps it off for its queues.

  - name: forward-accept-established
    src: any
    protocol: any
    action: accept
    chain: forward
    applies_to: [router1, router2]
    connection_state: [established, related, untracked]

  - name: emergency-access-isolation-from
    description: The break-glass port reaches only its own router
    src: Emergency_Console_Access
    protocol: any
    action: drop
    chain: forward
    applies_to: [router1, router2]

  - name: emergency-access-isolation-to
    description: Nothing is routed to the break-glass port
    src: any
    dst: Emergency_Console_Access
    protocol: any
    action: drop
    chain: forward
    applies_to: [router1, router2]

  - name: ipv6-blocked
    description: IPv4 only; nothing is routed over IPv6
    src: any
    protocol: any
    action: drop
    chain: forward
    applies_to: [router1, router2]
    family: ipv6
    notes: Issue #64. IPv6 is off on router1's internet side and dropped in every zone.

  - name: ipv6-blocked-input
    description: No zone reaches the routers themselves over IPv6
    src: any
    protocol: any
    action: drop
    chain: input
    applies_to: [router1, router2]
    family: ipv6

  # ==========================================================================
  # DNS and time
  # ==========================================================================

  - name: unbound-zones-to-resolvers-tcp
    description: Unbound DNS and chrony; Smart Home and Devices get public names and blocklists only
    src: [Users, App_Servers, DevOps, Security, Smart_Home, Devices, NVR, Hardware_Management, Server_Management, Power_Management]
    dst: Resolvers
    protocol: tcp
    ports: [53]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: unbound-zones-to-resolvers-udp
    description: Unbound DNS and chrony; Smart Home and Devices get public names and blocklists only
    src: [Users, App_Servers, DevOps, Security, Smart_Home, Devices, NVR, Hardware_Management, Server_Management, Power_Management]
    dst: Resolvers
    protocol: udp
    ports: [53, 123]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: resolvers-recursion-tcp
    description: Only the resolvers reach the internet's root, TLD and authoritative servers
    src: Resolvers
    dst: any
    protocol: tcp
    ports: [53]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    out_interface_list: WAN
    notes: "Issue #120. Unbound recurses, so the servers can't be named; the WAN list keeps it to the internet. Queries cross the ISP in clear; accepted."

  - name: resolvers-recursion-udp
    description: Only the resolvers reach the internet's root, TLD and authoritative servers
    src: Resolvers
    dst: any
    protocol: udp
    ports: [53]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    out_interface_list: WAN
    notes: Issue #120. As resolvers-recursion-tcp.

  - name: resolvers-to-ntp-pools
    description: chrony on the resolvers syncs to the public NTP pools
    src: Resolvers
    dst: any
    protocol: udp
    ports: [123]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    out_interface_list: WAN
    notes: "Issues #68 and #120: chrony runs beside Unbound on dns1 and file1, and NTP pools are pulled directly. Pool servers rotate, so they can't be named; the WAN list keeps it to the internet."

  - name: direct-dns-zones-to-public-resolvers-tcp
    description: Guest, RetroNet and DMZ use Quad9 and Cloudflare directly
    src: [Guest, RetroNet, DMZ]
    dst: Public_Resolvers
    protocol: tcp
    ports: [53]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: direct-dns-zones-to-public-resolvers-udp
    description: Guest, RetroNet and DMZ use Quad9 and Cloudflare directly
    src: [Guest, RetroNet, DMZ]
    dst: Public_Resolvers
    protocol: udp
    ports: [53]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: management-to-public-resolvers-tcp
    description: Temporary; Management resolves through Quad9 until the house's resolvers exist
    src: [Hardware_Management, Server_Management, Power_Management]
    dst: Public_Resolvers
    protocol: tcp
    ports: [53]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: "Blog issue #645. Temporary: Step 1.10 applies it so bastion1 and nut1 still resolve names (and take updates through named-outbound) once default deny is on. Step 2.3 removes it when Management moves to dns1."

  - name: management-to-public-resolvers-udp
    description: Temporary; Management resolves through Quad9 until the house's resolvers exist
    src: [Hardware_Management, Server_Management, Power_Management]
    dst: Public_Resolvers
    protocol: udp
    ports: [53]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Blog issue #645. Temporary, as management-to-public-resolvers-tcp; Step 2.3 removes it.

  - name: dns-bypass-drop-tcp
    description: Plain DNS and DNS over TLS to the internet are dropped for zones that use Unbound
    src: [Users, App_Servers, DevOps, Security, Smart_Home, Devices, NVR, Central_Servers]
    dst: any
    protocol: tcp
    ports: [53, 853]
    action: drop
    chain: forward
    applies_to: [router1, router2]
    notes: A redirect is added only for a specific device that breaks. DNS over HTTPS can't be blocked this way; accepted.

  - name: dns-bypass-drop-udp
    description: Plain DNS and DNS over TLS to the internet are dropped for zones that use Unbound
    src: [Users, App_Servers, DevOps, Security, Smart_Home, Devices, NVR, Central_Servers]
    dst: any
    protocol: udp
    ports: [53, 853]
    action: drop
    chain: forward
    applies_to: [router1, router2]
    notes: A redirect is added only for a specific device that breaks. DNS over HTTPS can't be blocked this way; accepted.

  # ==========================================================================
  # Users
  # ==========================================================================

  - name: users-to-app-servers-web
    description: App-Servers web through the internal proxy
    src: Users
    dst: App_Nodes
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: users-to-sso
    src: Users
    dst: SSO
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: users-to-ca
    description: step-ca, including SSH certificates after SSO
    src: Users
    dst: CAs
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: users-to-directory-tcp
    description: Samba AD for domain join and login
    src: Users
    dst: Directory
    protocol: tcp
    ports: [53, 88, 135, 389, 445, 464, 636, 3268, 3269, "49152-65535"]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: users-to-directory-udp
    description: Samba AD for domain join and login
    src: Users
    dst: Directory
    protocol: udp
    ports: [53, 88, 123, 389, 464]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: users-to-file-server
    description: Homes on file1 through router2
    src: Users
    dst: FileServers
    protocol: tcp
    ports: [445]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: users-to-bastion-ssh
    src: Users
    dst: Bastion_SSH
    protocol: tcp
    ports: [22]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: users-to-gitlab
    description: GitLab web and Git over SSH, for pushing code
    src: Users
    dst: GitLab
    protocol: tcp
    ports: [22, 443]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #69.

  - name: users-to-log-collectors
    description: Elastic Agent on Users workstations and tailgw1 ships logs to Security Onion
    src: Users
    dst: Log_Collectors
    protocol: tcp
    ports: [5055, 8220]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #71. Users' workstations have no CrowdSec agent, but their logs still reach Security Onion. Fleet and Elastic Agent ingest only; no syslog or LAPI.

  - name: users-and-guests-to-printers
    description: Guests enter the printer's address; no discovery relay
    src: [Users, Guest]
    dst: Printers
    protocol: tcp
    ports: [515, 631, 9100]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: users-to-fabrication
    description: Mainsail, Moonraker and Spoolman; Fabrication has no internet
    src: Users
    dst: Fabrication_Machines
    protocol: tcp
    ports: [80, 443, 7125, 7912]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Ports for laser1, cnc1 and cutter1 are added when they are bought.

  - name: users-to-leds
    src: Users
    dst: LEDs
    protocol: tcp
    ports: [80]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: sunshine-stream-tcp
    description: Named TVs to named Sunshine hosts
    src: Sunshine_Targets
    dst: Sunshine_Sources
    protocol: tcp
    ports: [47984, 47989, 48010]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: sunshine-stream-udp
    src: Sunshine_Targets
    dst: Sunshine_Sources
    protocol: udp
    ports: [5353, "47998-48010"]
    action: accept
    chain: forward
    applies_to: [router2]

  # ==========================================================================
  # Remote access: household tailnet users through tailgw1 (issue #146).
  # Remote admins reach bastion1 inside the tunnel, so no router rule
  # applies to them (fw_groups.yml Remote_Admins).
  # ==========================================================================

  - name: remote-users-to-dns-tcp
    src: Remote_Users
    dst: Resolvers
    protocol: tcp
    ports: [53]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: remote-users-to-dns-udp
    src: Remote_Users
    dst: Resolvers
    protocol: udp
    ports: [53]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: remote-users-to-sso
    src: Remote_Users
    dst: SSO
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Authelia requires two-factor from 100.64.0.0/10.

  - name: remote-users-to-app-servers-web
    src: Remote_Users
    dst: App_Nodes
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]

  # ==========================================================================
  # App-Servers
  # ==========================================================================

  - name: app-servers-to-sso
    src: App_Servers
    dst: SSO
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: app-servers-to-ca
    description: cert-manager ACME
    src: App_Servers
    dst: CAs
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: app-servers-to-openbao
    description: External Secrets Operator, Kubernetes auth
    src: App_Nodes
    dst: Secrets
    protocol: tcp
    ports: [8200]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: app-servers-to-dmz-media
    description: The internal proxy and Seerr reach Jellyfin
    src: App_Nodes
    dst: DMZ_Nodes
    protocol: tcp
    ports: [443, 8096]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Issue #111 dropped Plex's 32400.

  - name: dmz-to-app-servers-ingress-exceptions
    description: DMZ Traefik to the internal proxy's ingress-exception entrypoint (Seerr and Vaultwarden only)
    src: DMZ_Nodes
    dst: App_Nodes
    protocol: tcp
    ports: [8443]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Issue #95. The only path the DMZ starts into an internal zone. The entrypoint carries only the exception routes, served with a step-ca certificate. Port chosen here; no ticket fixed it.

  - name: argocd-to-dmz-cluster-api
    description: One Argo CD in App-Servers manages both clusters
    src: App_Nodes
    dst: DMZ_Nodes
    protocol: tcp
    ports: [6443]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: app-servers-to-gitlab
    description: Argo CD reads the Apps repo, and the cluster pulls private images from GitLab's registry
    src: App_Nodes
    dst: GitLab
    protocol: tcp
    ports: [443, 5050]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #69. 5050 is GitLab's documented registry port when the registry shares GitLab's domain; no ticket fixed it.

  # ==========================================================================
  # DevOps (named deployment targets)
  # ==========================================================================

  - name: devops-to-hypervisors
    description: OpenTofu and Ansible against Proxmox
    src: Runners
    dst: Hypervisors
    protocol: tcp
    ports: [22, 8006]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: devops-to-switches
    src: Runners
    dst: Hardware_Management
    protocol: tcp
    ports: [22, 443]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: devops-to-hosts-ssh
    description: Ansible over SSH with short step-ca certificates
    src: Runners
    dst: [Central_Servers, App_Servers, Security, DMZ, Fabrication]
    protocol: tcp
    ports: [22]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: devops-to-cluster-apis
    description: K3s work, and the scheduled job that writes DMZ secrets
    src: Runners
    dst: [App_Nodes, DMZ_Nodes]
    protocol: tcp
    ports: [6443]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: devops-to-zot
    description: Runners push custom DMZ images, such as the blog, to Zot
    src: Runners
    dst: DMZ_Nodes
    protocol: tcp
    ports: [5000]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Issue #96. Zot's default port; TLS with a step-ca certificate. Nothing new in the DMZ-to-anywhere direction.

  - name: devops-to-trust-base
    description: Pipeline jobs log in to OpenBao with GitLab ID tokens; deploy role issues step-ca certificates
    src: DevOps
    dst: [Secrets, CAs, SSO]
    protocol: tcp
    ports: [443, 8200]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: gitlab-to-shared-databases
    description: GitLab on shared Postgres 18 and Redis
    src: GitLab
    dst: FileServers
    protocol: tcp
    ports: [5432, 6379]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: devops-to-truenas-api
    src: Runners
    dst: FileServers
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]

  - name: devops-to-file1-backups
    description: The GitLab backup and the repo export land on file1 over SSH
    src: DevOps
    dst: FileServers
    protocol: tcp
    ports: [22]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #187. Two file1 accounts, each limited by rrsync to writing its own folder, so no client can delete (issue #72).

  - name: runners-to-workstations
    description: The pipeline pushes workstation management, SSH to Mint and WinRM over HTTPS to Windows
    src: Runners
    dst: Users
    protocol: tcp
    ports: [22, 5986]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #187. The pipeline always pushes; nothing in Users reaches into DevOps for it. A workstation that is off, asleep or away gets the change at the next run, with no retry.

  # ==========================================================================
  # Bastion
  # ==========================================================================

  - name: bastion-to-managed-hosts
    description: SSH and admin web interfaces on what it manages
    src: Bastions
    dst: [Central_Servers, App_Servers, DevOps, Security, DMZ, Fabrication, Devices]
    protocol: tcp
    ports: [22, 443]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: bastion-to-untrusted-devices
    description: router3, ap2 and switch3 over the routed path; nothing back except replies
    src: Bastions
    dst: Untrusted_Devices
    protocol: tcp
    ports: [22, 80, 443]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: bastion-to-ca
    src: Bastions
    dst: CAs
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]

  # ==========================================================================
  # Monitoring and logs
  # ==========================================================================

  - name: metrics-scrape
    description: Prometheus pulls exporters; targets and further ports live in code
    src: Metrics
    dst: [Central_Servers, App_Servers, DevOps, DMZ, Fabrication, NVR, Hardware_Management, Server_Management, Power_Management]
    protocol: tcp
    ports: [9100]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: metrics-to-dmz-nodes
    description: Prometheus pulls jellyfin_exporter and relay1's exporters, which k3s-dmz1 forwards
    src: Metrics
    dst: DMZ_Nodes
    protocol: tcp
    ports: [9101, 9102, 9594]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: |
      Issue #111: 9594 is jellyfin_exporter; an alert on jellyfin_up covers server down, so no
      blackbox probe. Issue #156: 9101 (relay1's node exporter) and 9102 (relay1's Traefik
      metrics) are forwarded by k3s-dmz1's host to relay1 over the Headscale tailnet.

  - name: metrics-to-nut
    description: NUT's exporter on metrics1 reads nut1's NUT server
    src: Metrics
    dst: NUT
    protocol: tcp
    ports: [3493]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #187. Proxy exporters run on metrics1; everything else reaches Prometheus through node_exporter's textfile collector on 9100 (metrics-scrape).

  - name: metrics-to-hypervisors-api
    description: The PVE exporter on metrics1 reads each Proxmox host's API
    src: Metrics
    dst: Hypervisors
    protocol: tcp
    ports: [8006]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Issue #187.

  - name: metrics-to-switches-snmp
    description: snmp_exporter on metrics1 polls the switches
    src: Metrics
    dst: Switches
    protocol: udp
    ports: [161]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Issue #187.

  - name: security-to-ca
    description: step-ca service and SSH host certificates for the Security hosts
    src: Security
    dst: CAs
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #66. Prometheus and Grafana on metrics1 carry step-ca certificates.

  - name: metrics-to-sso
    description: Grafana's OIDC token exchange with Authelia
    src: Metrics
    dst: SSO
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #66. Grafana logs users in through Authelia.

  - name: runners-to-prometheus
    description: The pipeline's pre-flight check queries backup freshness before anything destructive
    src: Runners
    dst: Metrics
    protocol: tcp
    ports: [9090]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #72. Prometheus's query API on its default port; the one path DevOps starts into Security besides logs.

  - name: logs-to-security-tcp
    description: Elastic Agent/Fleet, syslog and the CrowdSec LAPI; the DMZ is the one named exception
    src: [Central_Servers, App_Servers, DevOps, DMZ_Nodes, Fabrication, NVR, Hardware_Management, Server_Management, Power_Management, Routers]
    dst: Log_Collectors
    protocol: tcp
    ports: [514, 5055, 8080, 8220]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Besides users-to-log-collectors and runners-to-prometheus, nothing else reaches Security.

  - name: logs-to-security-udp
    src: [Hardware_Management, Server_Management, Power_Management, Routers]
    dst: Log_Collectors
    protocol: udp
    ports: [514]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  # ==========================================================================
  # Power and start order
  # ==========================================================================

  - name: nut-to-pve5-api
    description: Token limited to starting and stopping VMs and reading their guest agents
    src: NUT
    dst: Hypervisor_pve5
    protocol: tcp
    ports: [8006]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #187. The start order's health checks use the same path, so they need no rule of their own.

  - name: nut-clients
    src: [Hypervisors, FileServers]
    dst: NUT
    protocol: tcp
    ports: [3493]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  # ==========================================================================
  # file1 exceptions (backup and library)
  # ==========================================================================

  - name: proxy-to-home-assistant
    description: The internal proxy fronts ha.mikewashere.lan
    src: App_Nodes
    dst: Home_Assistant
    protocol: tcp
    ports: [8123]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #98. No rule from Users into Smart Home; Home Assistant uses its own login with TOTP, since forward auth breaks the mobile app.

  - name: proxy-to-nvr
    description: The internal proxy fronts cameras.mikewashere.lan (Frigate's authenticated port)
    src: App_Nodes
    dst: NVR
    protocol: tcp
    ports: [8971]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #98; optional upgrade. Frigate sits behind Authelia. Live view is MSE over a websocket on 8971, so RTSP (8554) and WebRTC (8555) are never exposed.

  - name: home-assistant-to-nvr
    description: MQTT over TLS, and Frigate clips and snapshots
    src: Home_Assistant
    dst: NVR
    protocol: tcp
    ports: [8883, 8971]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #98; optional upgrade. Mosquitto runs on the NVR host, so Frigate's own MQTT connection never leaves the box.

  - name: admin-ssh-to-nvr
    description: Bastion and Ansible SSH to the NVR host
    src: [Bastions, Runners]
    dst: NVR
    protocol: tcp
    ports: [22]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Issue #98; optional upgrade. SSH only, to the NVR host only; the cameras are never reachable.

  - name: nvr-to-restic
    description: Saved clips to file1's append-only restic REST server
    src: NVR
    dst: FileServers
    protocol: tcp
    ports: [8000]
    action: accept
    chain: forward
    applies_to: [router2]
    notes: Issue #98; optional upgrade. Pushes /media/frigate/exports only, on file1's Central-Servers address (issue #107).

  - name: dmz-to-library-and-backup
    description: Read-only media library and append-only restic REST server
    src: DMZ_Nodes
    dst: FileServers
    protocol: tcp
    ports: [2049, 8000]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Issue #107. NFSv4 library and downloads (issue #116) exports, read-only to k3s-dmz1 with all users squashed; the DMZ has its own REST-server credential under --private-repos, append-only.

  - name: hypervisors-to-backup-share
    description: vzdump to file1's NFS backup share
    src: Hypervisors
    dst: FileServers
    protocol: tcp
    ports: [2049]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Issue #107. NFSv4; the vzdump export is read-write to the hypervisors' Server-Management addresses only.

  # ==========================================================================
  # Internet egress (after every internal accept)
  # ==========================================================================

  - name: drop-unlisted-private
    description: Anything internal not accepted above stops here, so the egress rules below reach only the internet
    src: any
    dst: RFC1918_Private
    protocol: any
    action: drop
    chain: forward
    applies_to: [router1, router2]

  - name: internet-any
    src: [Users, Guest, Smart_Home]
    protocol: any
    action: accept
    chain: forward
    applies_to: [router1, router2]
    out_interface_list: WAN

  - name: internet-web
    src: [App_Servers, DevOps, DMZ]
    protocol: tcp
    ports: [80, 443]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    out_interface_list: WAN
    notes: "Accepted risk: a compromised host can still send data out over web ports."

  - name: dmz-to-cloudflare-tunnel-tcp
    description: cloudflared's outbound connections to Cloudflare Tunnel
    src: DMZ_Nodes
    dst: Cloudflare_Tunnel
    protocol: tcp
    ports: [7844]
    action: accept
    chain: forward
    applies_to: [router1]
    notes: Issue #93. Port 443 for cloudflared's update checks is already in internet-web.

  - name: dmz-to-cloudflare-tunnel-udp
    description: cloudflared's outbound connections to Cloudflare Tunnel (QUIC)
    src: DMZ_Nodes
    dst: Cloudflare_Tunnel
    protocol: udp
    ports: [7844]
    action: accept
    chain: forward
    applies_to: [router1]
    notes: Issue #93.

  - name: dmz-to-relay
    description: k3s-dmz1's Tailscale client dials out to relay1, the only path for watch, downloads and game traffic
    src: DMZ_Nodes
    dst: Relay
    protocol: udp
    ports: [41641]
    action: accept
    chain: forward
    applies_to: [router1]
    notes: |
      Issue #148; replaces the router1 port forwards internet-to-jellyfin,
      internet-to-valheim and internet-to-v-rising, so the house has no
      inbound port for public traffic. WireGuard to tailscaled's default
      port on relay1; Headscale control and the DERP fallback ride TCP 443,
      already in internet-web. Router1 sees only the encrypted link. The
      relay's traffic is filtered by the Headscale ACL, then k3s-dmz1's
      host firewall on tailscale0, then the DMZ default-deny NetworkPolicy.

  - name: household-tailnet-control
    description: Tailscale coordination and DERP relays for bastion1 and file1 on the household tailnet
    src: Household_Tailnet
    dst: Tailscale_Service
    protocol: tcp
    ports: [443]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: |
      Issue #146. Replaces router1's WireGuard listener, so the house has
      zero inbound ports. tailgw1 is in Users and needs no rule.

  - name: household-tailnet-stun
    description: STUN to Tailscale's DERP servers, so tailscaled can find its public address
    src: Household_Tailnet
    dst: Tailscale_Service
    protocol: udp
    ports: [3478]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: household-tailnet-direct
    description: Direct WireGuard connections from tailscaled's port to any tailnet peer
    src: Household_Tailnet
    protocol: udp
    action: accept
    chain: forward
    applies_to: [router1, router2]
    src_ports: [41641, 41642]
    out_interface_list: WAN
    notes: |
      Source ports are bastion1's and file1's tailnet_port (systems.yml), each
      kept unchanged by router1's source NAT (blog issue #637). tailgw1's
      41643 leaves through Users' internet-any. Peers sit behind other NATs at
      unknown addresses and ports, so the destination can't be narrowed;
      without this rule connections fall back to DERP over TCP 443. The
      Phase 1 check is a direct (not relayed) connection from an admin laptop
      to bastion1 (tailscale status). Source: tailscale.com/kb/1082/firewall-ports.

  - name: vpn-endpoint
    description: gluetun's tunnel to the VPN provider
    src: App_Nodes
    protocol: udp
    ports: [51820]
    action: accept
    chain: forward
    applies_to: [router1, router2]
    notes: Port depends on the provider; set when built.

  - name: named-outbound
    description: Debian mirrors, Backblaze B2 and each service's named domains
    src: [Central_Servers, Security, NVR, Hardware_Management, Server_Management, Power_Management]
    dst: Named_Outbound
    protocol: tcp
    ports: [80, 443]
    action: accept
    chain: forward
    applies_to: [router1, router2]

  - name: retronet-allowlist-web
    src: RetroNet
    protocol: tcp
    ports: [80, 443]
    action: accept
    chain: forward
    applies_to: [router1]
    notes: Game and service ports are added through Git. Per-device connection and bandwidth limits are queues, set by the RetroNet Steps.

  - name: retronet-drop-logged
    description: Whatever RetroNet's allowlist didn't accept is dropped and logged
    src: RetroNet
    protocol: any
    action: drop
    chain: forward
    applies_to: [router1]
    log: true
    notes: Issue #64 (logged drops). Sits last before forward-final-drop, so only RetroNet's misses are logged.

  - name: forward-final-drop
    src: any
    protocol: any
    action: drop
    chain: forward
    applies_to: [router1, router2]

  # ==========================================================================
  # router3 backstop (RetroNet only)
  # ==========================================================================

  - name: router3-bastion-ssh
    src: Bastions
    protocol: tcp
    ports: [22]
    action: accept
    chain: input
    applies_to: [router3]
    notes: Arrives over the routed path through router1; may need a local account and older algorithms.

  - name: router3-retronet-dhcp
    src: RetroNet
    protocol: udp
    ports: [67]
    action: accept
    chain: input
    applies_to: [router3]

  - name: router3-retronet-icmp
    src: RetroNet
    protocol: icmp
    action: accept
    chain: input
    applies_to: [router3]

  - name: router3-retronet-deny-private
    src: RetroNet
    dst: RFC1918_Private
    protocol: any
    action: drop
    chain: forward
    applies_to: [router3]
    notes: Backstop only; router1 enforces the RetroNet allowlist.

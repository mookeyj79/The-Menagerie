# ============================================================================
# fw_groups.yml - Firewall/ACL address-list group definitions (MEMBERSHIP ONLY)
# ============================================================================
# Answers exactly one question: "what belongs to this name?" No awareness of
# how a group is used downstream. Two other files consume these names:
#
#   fw_rules.yml         - network policy (router filter chains, router3's
#                          ACL, and each managed Linux host's nftables)
#   bastion_access.yml   - identity policy (who may reach what via bastion1)
#
# `category` (zone | role) is documentation only, not an enforced type.
#
# ============================================================================
# Schema
# ============================================================================
#
#   name         : literal string rendered into address-lists/ACLs/aliases.
#                  No case-transform applied by any renderer.
#
#   category     : zone | role
#                    - zone: membership == one or more vlans.yml VLANs,
#                            optionally plus literal extras
#                    - role: everything else
#
#   derive_from  : auto-population. May combine with `members` (union).
#     vlan: <name> | [<name>, ...]
#                  - all subnets under the named vlans.yml VLAN(s)
#     role: <value>
#                  - all systems.yml entries whose `role:` field matches,
#                    excluding state: decommissioned
#
#   members      : list of short-form strings or long-form mappings.
#
#   description  : one-line human-readable purpose
#   notes        : optional; structural context only
#
# ============================================================================
# Member reference forms
# ============================================================================
#
# Short form (plain string), disambiguated in order:
#   1. Contains a slash          -> CIDR                  192.168.17.0/24
#   2. Valid IPv4 literal        -> single-host CIDR /32  192.168.17.2
#   3. Otherwise                 -> systems.yml hostname, primary interface
#
# Long form (mapping):
#   - host: <hostname>
#     interface: <iface-name>    # required if host has >1 interface
#     comment: <optional>
#   - cidr: <ip-or-cidr>
#     comment: <required>
#   - fqdn: <dns-name>
#     comment: <optional>
#                  - a DNS name the router resolves itself, refreshing the
#                    addresses when their TTL runs out. CDN names can miss
#                    addresses clients use; accepted (issue #64).
#
# A host member that is state: planned, or has no address yet (one a cloud
# provider assigns), renders nothing, so the group's rules match nothing
# until the host exists (blog issue #628).
#
# ============================================================================

groups:

  # ==========================================================================
  # Zone groups - VLAN-derived (one per zone VLAN, issue #64)
  # ==========================================================================

  - name: Architecture
    category: zone
    description: Router-to-router point-to-point links
    derive_from:
      vlan: [architecture-1, architecture-2]

  - name: DMZ
    category: zone
    description: Public entry point and the DMZ K3s cluster
    derive_from:
      vlan: dmz

  - name: RetroNet
    category: zone
    description: Retro computers and consoles; untrusted, internet-only
    derive_from:
      vlan: retronet

  - name: Central_Servers
    category: zone
    description: Bootstrap-tier services and file1
    derive_from:
      vlan: central-servers

  - name: App_Servers
    category: zone
    description: App-Servers K3s cluster nodes
    derive_from:
      vlan: app-servers

  - name: DevOps
    category: zone
    description: GitLab and its runners
    derive_from:
      vlan: devops

  - name: Security
    category: zone
    description: Security Onion, CrowdSec LAPI, Prometheus and Grafana
    derive_from:
      vlan: security

  - name: Users
    category: zone
    description: Household workstations and personal devices
    derive_from:
      vlan: users

  - name: Guest
    category: zone
    description: Guest Wi-Fi
    derive_from:
      vlan: guest

  - name: Devices
    category: zone
    description: Printers and shared peripherals
    derive_from:
      vlan: devices

  - name: Fabrication
    category: zone
    description: 3D printers, laser, CNC and vinyl cutter (Devices zone, own VLAN)
    derive_from:
      vlan: fabrication

  - name: Smart_Home
    category: zone
    description: Smart home devices and hubs
    derive_from:
      vlan: smart-home

  - name: Surveillance
    category: zone
    description: Cameras and NVR
    derive_from:
      vlan: surveillance

  - name: Hardware_Management
    category: zone
    description: Management for routers, switches and access points
    derive_from:
      vlan: hardware-management

  - name: Server_Management
    category: zone
    description: Management for servers and hypervisors
    derive_from:
      vlan: server-management

  - name: Power_Management
    category: zone
    description: NUT and the PDU
    derive_from:
      vlan: power-management

  - name: Internal
    category: zone
    description: Every router2 zone in one entry
    members:
      - cidr: 192.168.16.0/20
        comment: VLANs 16-31 by design; peer subnets sit outside it on purpose

  # ==========================================================================
  # Not zones: break-glass and the household tailnet (issues #81, #146)
  # ==========================================================================

  - name: Emergency_Console_Access
    category: role
    description: Off-bridge break-glass port; one per hEX, never routed
    members:
      - cidr: 10.9.11.0/29
        comment: Reused identically on each hEX's off-bridge port; never routed or advertised
    notes: |
      Router3 uses its RS-232 console and the ICX switches their console
      ports instead of an IP-based off-bridge segment.

  - name: Remote_Users
    category: role
    description: Household tailnet devices reaching home through tailgw1, split tunnel
    members:
      - cidr: 100.64.0.0/10
        comment: Tailscale's address range; family and the owner's user devices away from home
    notes: |
      Issue #146. tailgw1 forwards without address translation, so remote users
      arrive at router2 on VLAN20 with their tailnet address, and router2's
      static route sends replies back through tailgw1. Router2 accepts this
      range only from tailgw1; the relay's Headscale tailnet uses the same
      range on k3s-dmz1's tailscale0 but never routes it, so it can't collide.
      Which tailnet devices may use tailgw1 is set by the tailnet access rules.

  - name: Remote_Admins
    category: role
    description: The owner's admin laptops on the household tailnet, reaching bastion1's SSH only
    members: []
    notes: |
      Issue #146. Not a router group: admin laptops reach bastion1's tailscale0
      inside the tunnel, so no router sees or filters the traffic. Enforced by
      the tailnet access rules (Infra repo, OpenTofu's Tailscale provider),
      which let only devices tagged as admin laptops reach bastion1 on TCP 22,
      and by bastion1's host firewall on tailscale0. Admin laptops never use
      tailgw1, and no device is both an admin laptop and a remote user. Kept
      here so the policy has one name in bastion_access.yml.

  - name: Household_Tailnet
    category: role
    description: House machines on the household tailnet (hosted Tailscale) that dial out from a router-filtered zone
    members:
      - host: bastion1
        interface: eth0.101
      - host: file1
        interface: eth0.16
    notes: |
      Issue #146. tailgw1 is also a member of the tailnet but sits in Users,
      whose internet-any already covers it. backup1 is offsite. Separate from
      the relay's Headscale tailnet (issue #148).

  - name: Tailscale_Service
    category: role
    description: Tailscale's coordination servers and DERP relays the household tailnet dials out to
    members:
      - fqdn: controlplane.tailscale.com
      - fqdn: login.tailscale.com
      - fqdn: log.tailscale.com
      - fqdn: console.tailscale.com
      - fqdn: derp1-all.tailscale.com
      - fqdn: derp2-all.tailscale.com
      - fqdn: derp3-all.tailscale.com
      - fqdn: derp4-all.tailscale.com
      - fqdn: derp5-all.tailscale.com
      - fqdn: derp6-all.tailscale.com
      - fqdn: derp7-all.tailscale.com
      - fqdn: derp8-all.tailscale.com
      - fqdn: derp9-all.tailscale.com
      - fqdn: derp10-all.tailscale.com
      - fqdn: derp11-all.tailscale.com
      - fqdn: derp12-all.tailscale.com
      - fqdn: derp13-all.tailscale.com
      - fqdn: derp14-all.tailscale.com
      - fqdn: derp15-all.tailscale.com
      - fqdn: derp16-all.tailscale.com
      - fqdn: derp17-all.tailscale.com
      - fqdn: derp18-all.tailscale.com
      - fqdn: derp19-all.tailscale.com
      - fqdn: derp20-all.tailscale.com
      - fqdn: derp21-all.tailscale.com
      - fqdn: derp22-all.tailscale.com
      - fqdn: derp23-all.tailscale.com
      - fqdn: derp24-all.tailscale.com
      - fqdn: derp25-all.tailscale.com
      - fqdn: derp26-all.tailscale.com
      - fqdn: derp27-all.tailscale.com
      - fqdn: derp28-all.tailscale.com
    notes: |
      DERP regions 1-28 from controlplane.tailscale.com/derpmap/default,
      written out by hand (blog issue #628) so a review shows every change.
      Tailscale recommends allowing *:443 because the DERP set grows; a
      region missing from the list only loses that relay, an accepted risk.
      Source: tailscale.com/kb/1082/firewall-ports.

  # ==========================================================================
  # Role groups - Central-Servers services
  # ==========================================================================

  - name: Resolvers
    category: role
    description: Unbound resolvers serving .lan, .man and filtered public names
    members:
      - host: dns1
      - host: file1
        interface: eth0.16
        comment: Second Unbound as a TrueNAS app until dns2 is bought

  - name: CAs
    category: role
    description: step-ca intermediate
    members:
      - host: ca1

  - name: Secrets
    category: role
    description: Secrets management host (OpenBao)
    members:
      - host: bao1

  - name: Directory
    category: role
    description: Samba AD domain controllers
    members:
      - host: dc1

  - name: SSO
    category: role
    description: Authelia
    members:
      - host: sso1

  - name: FileServers
    category: role
    description: file1's Central-Servers interface (UI and SSH, plus the routed file, database and REST-server exceptions)
    members:
      - host: file1
        interface: eth0.16

  - name: FileServer_Storage
    category: role
    description: file1's Storage VLAN interface (SMB, NFS, databases, REST server)
    members:
      - host: file1
        interface: storage

  # ==========================================================================
  # Role groups - clusters, pipeline, security
  # ==========================================================================

  - name: DMZ_Nodes
    category: role
    description: DMZ K3s cluster nodes; the public entry point listens here
    members:
      - host: k3s-dmz1

  - name: App_Nodes
    category: role
    description: App-Servers K3s cluster nodes; the internal proxy listens here
    members:
      - host: k3s-app1
        interface: eth0

  - name: GitLab
    category: role
    description: GitLab CE
    members:
      - host: devops1

  - name: Runners
    category: role
    description: GitLab runners; the pipeline's deployment source
    members:
      - host: runner1

  - name: Log_Collectors
    category: role
    description: Named log and signal inputs in Security (Elastic Agent/Fleet, syslog, CrowdSec LAPI)
    members:
      - host: secmon1
        interface: eth0
      - host: crowdsec1

  - name: Metrics
    category: role
    description: Prometheus; pulls exporter ports in each zone
    members:
      - host: metrics1

  - name: NUT
    category: role
    description: NUT server and start-order runner
    members:
      - host: nut1

  # ==========================================================================
  # Role groups - infrastructure
  # ==========================================================================

  - name: Bastions
    category: role
    description: The only admin path
    members:
      - host: bastion1
        interface: eth0.101
        comment: Hardware-management leg; the SSH address
      - host: bastion1
        interface: eth0.102
        comment: Server-management leg
      - host: bastion1
        interface: eth0.103
        comment: Power-management leg
    notes: |
      Single-host group. Add a second bastion here if/when a failover host
      exists.

  - name: Bastion_SSH
    category: role
    description: The bastion's one SSH address, the only one Users and remote admins reach
    members:
      - host: bastion1
        interface: eth0.101

  - name: Hypervisors
    category: role
    description: Proxmox hosts
    derive_from:
      role: hypervisor

  - name: Hypervisor_pve5
    category: role
    description: pve5's Proxmox API, which NUT uses to start and stop VMs
    members:
      - host: pve5
        interface: eth0.102

  - name: Routers
    category: role
    description: Network device control plane
    derive_from:
      role: router

  - name: Router1_Management
    category: role
    description: router1's Management addresses, which bastion1 reaches through router2
    members:
      - host: router1
        interface: VLAN101
      - host: router1
        interface: VLAN102
    notes: |
      Blog issue #694. bastion1's legs sit in router2's half of each
      Management /28, so its traffic to router1 crosses router2's forward
      chain.

  - name: Switches
    category: role
    description: The ICX switches snmp_exporter polls
    members:
      - host: switch1
      - host: switch2
    notes: |
      Issue #187. Not derived from role switch: switch3 sits in RetroNet as an
      untrusted device reached only through the bastion, and switch4 (a
      GS108PE) has no SNMP agent.

  - name: Untrusted_Devices
    category: role
    description: RetroNet devices managed through the bastion over the routed path
    members:
      - host: router3
        interface: GigabitEthernet1/0.5
      - host: ap2
      - host: switch3

  # ==========================================================================
  # Role groups - devices
  # ==========================================================================

  - name: Printers
    category: role
    description: Printers; Users and Guest reach them by address
    members:
      - host: printer1
      - host: printer2

  - name: Fabrication_Machines
    category: role
    description: Fabrication machines Users may reach
    derive_from:
      role: cnc

  # ==========================================================================
  # Role groups - unmanaged devices (literal IPs; no systems.yml presence)
  # ==========================================================================

  - name: LEDs
    category: role
    description: Smart LED strips Users may reach
    members:
      - cidr: 192.168.24.15
        comment: led-strip1
      - cidr: 192.168.24.16
        comment: led-strip2
      - cidr: 192.168.24.17
        comment: led-strip3
      - cidr: 192.168.24.18
        comment: led-strip4

  - name: Sunshine_Sources
    category: role
    description: Users hosts permitted to stream via Sunshine
    members:
      - cidr: 192.168.20.3
        comment: Desky (Ethernet)
      - cidr: 192.168.20.4
        comment: KellysKomputer (Ethernet)
      - cidr: 192.168.20.5
        comment: KellysKomputer (WiFi)
      - cidr: 192.168.20.7
        comment: Razzy (Core Ethernet)
      - cidr: 192.168.20.8
        comment: Razzy (Ethernet)
      - cidr: 192.168.20.9
        comment: Razzy (WiFi)
    notes: DHCP reservations below the pool; last octets kept from the old Users VLAN.

  - name: Sunshine_Targets
    category: role
    description: Smart Home TVs that receive Sunshine streams
    members:
      - cidr: 192.168.24.30
        comment: Smart-TV2 (Office)
      - cidr: 192.168.24.31
        comment: TV, name not recorded
      - cidr: 192.168.24.32
        comment: TV formerly on router3's Smart Home subnet (192.168.19.66)

  - name: Home_Assistant
    category: role
    description: Home Assistant, the smart home hub; Users reach it only through the internal proxy
    members:
      - host: ha1

  - name: NVR
    category: role
    description: The NVR host (Frigate, Mosquitto); the one Surveillance machine that reaches outside the zone
    members:
      - host: nvr1
    notes: |
      Part of the Surveillance bundle, an optional upgrade (issue #98). While nvr1 is planned
      the list is empty and the rules naming it match nothing. Cameras are never members:
      they reach nothing outside the zone.

  # ==========================================================================
  # Public resolvers and named outbound destinations
  # ==========================================================================

  - name: Public_Resolvers
    category: role
    description: Quad9 and Cloudflare; the only DNS Guest, RetroNet and DMZ reach, and Management and the Unbound zones until Step 2.3
    members:
      - cidr: 9.9.9.9
        comment: Quad9
      - cidr: 149.112.112.112
        comment: Quad9
      - cidr: 1.1.1.1
        comment: Cloudflare
      - cidr: 1.0.0.1
        comment: Cloudflare

  - name: Named_Outbound
    category: role
    description: Domains Central-Servers, Security, Management and the NVR host may reach
    members:
      - fqdn: deb.debian.org
        comment: Debian packages
      - fqdn: security.debian.org
        comment: Debian security updates
      - fqdn: archive.raspberrypi.com
        comment: Raspberry Pi OS hosts (bastion1, nut1)
      - fqdn: download.docker.com
        comment: Docker's apt repository, for PeaNUT on nut1 (Blog issue #649)
      - fqdn: registry-1.docker.io
        comment: Docker Hub registry (PeaNUT)
      - fqdn: auth.docker.io
        comment: Docker Hub auth (PeaNUT)
      - fqdn: production.cloudfront.docker.com
        comment: Docker Hub image downloads (PeaNUT)
      - fqdn: ghcr.io
        comment: Frigate's image registry, for the NVR host (issue #98)
    notes: |
      A RouterOS address list built from DNS names (issue #64). Each service
      adds its domains when it is built. Backblaze B2's endpoint is named for
      the bucket's region, so it is added when the bucket is made.

  - name: Cloudflare_Tunnel
    category: role
    description: Cloudflare Tunnel edge that cloudflared in the DMZ connects out to
    members:
      - fqdn: region1.v2.argotunnel.com
      - fqdn: region2.v2.argotunnel.com
    notes: Issue #93.

  - name: Relay
    category: role
    description: relay1, the Linode VPS that k3s-dmz1's Tailscale client dials out to
    members:
      - host: relay1
    notes: |
      Issue #148. relay1's public address, which Linode assigns when
      OpenTofu creates the VPS. Until it is in systems.yml the list is empty
      and the rules naming it match nothing.

  - name: Friend_Countries
    category: role
    description: Address ranges of the owner's country; the only sources relay1's Traefik accepts for watch
    members: []
    notes: |
      Issue #111, premise: every friend watches from the owner's country.
      Rendered by the pipeline each month from a free no-account country list
      such as DB-IP Lite (CC BY 4.0) into the TCP IPAllowList on relay1's
      watch route (issue #148), so it has no fixed members here and no router
      rule uses it. A stale list fails safe: a friend on a newly assigned
      range is refused until the next refresh.

  # ==========================================================================
  # Cross-cutting groups
  # ==========================================================================

  - name: RFC1918_Private
    category: role
    description: All private address space; router3's backstop target and CrowdSec's allowlist
    members:
      - cidr: 10.0.0.0/8
      - cidr: 172.16.0.0/12
      - cidr: 192.168.0.0/16

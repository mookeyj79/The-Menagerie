# =====================================================================================================
# vlans.yml
# =====================================================================================================
# The decided network design, from "How zones are enforced: edge, routers, firewalls" (issue #64),
# with the Storage VLAN from "Observability and SIEM design" (issue #71). The routers do not run this
# yet: Phase 1 rebuilds the live network in place. What each router runs today is in its `live:` note
# in systems.yml, never here.
#
# Schema:
#   name        : short kebab-case identifier (used for cross-referencing)
#   description : human-readable purpose
#   zone        : security zone from the Security zone model (issue #63)
#   state       : present | planned. `present` only once the routers run it as described here.
#   dhcp         : { enabled, pool, lease_time, dns? } — top-level default; a subnet
#                  entry may override this if one router's segment differs
#                  (e.g. no DHCP on a transit-only subnet). dns lists the
#                  DNS servers the DHCP server hands out (RouterOS dns-server).
#   id          : 802.1Q VLAN ID
#   notes       : free-form operational notes
#   subnets     : list of { cidr, gateway_host, gateway_interface, dhcp? }.
#                 Every VLAN uses this list, even when there's only one
#                 subnet — single shape, no exceptions. Most VLANs have
#                 exactly one entry; VLANs routed (not bridged) across
#                 multiple per-router segments have one entry per router.
#
#                 cidr              : network range in CIDR notation
#                 gateway_host      : systems.yml hostname serving as gateway
#                                     for this subnet. Omit for transit/
#                                     no-gateway nets.
#                 gateway_interface : interface name on gateway_host to
#                                     resolve the gateway IP from. Required
#                                     when gateway_host has more than one
#                                     interface. The literal gateway IP is
#                                     never written here directly — it's
#                                     always resolved through systems.yml,
#                                     same pattern as dns.yml's host/interface.
#                 dhcp              : optional; overrides the VLAN-level dhcp
#                                     block for this specific subnet.
#                                     Default: .enabled: false
#
# Addressing: a zone VLAN's subnet follows its ID (192.168.<id>.0). Every router2 zone sits inside
# 192.168.16.0/20, so "anything internal" is one entry. Client zones get DHCP from their gateway
# router; servers and Management use static addresses.
# Not VLANs, so not listed here: the household tailnet's 100.64.0.0/10 (Remote_Users, routed by
# router2 to tailgw1, issue #146) and each hEX's break-glass port (10.9.11.0/29, never routed).
# =====================================================================================================

vlans:
  # ---------------------------------------------------------------------------------------------------
  # Router links
  # ---------------------------------------------------------------------------------------------------
  - name: architecture-1
    description: Authenticated OSPF point-to-point between router1 and router2
    zone: Architecture
    state: planned
    id: 301
    notes: Zone VLANs are passive in OSPF; only this link forms an adjacency.
    subnets:
      - cidr: 192.168.3.0/30

  - name: architecture-2
    description: Static-routed point-to-point between router1 and router3
    zone: Architecture
    state: planned
    id: 302
    notes: |
      Router3 stays out of OSPF so it can't advertise false routes. It has a static default via
      router1, and router1 has a static route to RetroNet. Router3 does no NAT.
    subnets:
      - cidr: 192.168.3.4/30

  # ---------------------------------------------------------------------------------------------------
  # Management (three VLANs; nothing passes between them except from the bastion)
  # ---------------------------------------------------------------------------------------------------
  - name: hardware-management
    description: Management for routers, switches and access points
    zone: Management
    state: planned
    id: 101
    notes: Router3 and ap2 are untrusted RetroNet devices with no interface here.
    subnets:
      - cidr: 10.0.1.0/28
        gateway_host: router1
        gateway_interface: VLAN101
      - cidr: 10.0.1.16/28
        gateway_host: router2
        gateway_interface: VLAN101

  - name: server-management
    description: Management for servers and hypervisors (iDRAC, Proxmox, TrueNAS UI)
    zone: Management
    state: planned
    id: 102
    subnets:
      - cidr: 10.0.2.0/28
        gateway_host: router1
        gateway_interface: VLAN102
      - cidr: 10.0.2.16/28
        gateway_host: router2
        gateway_interface: VLAN102

  - name: power-management
    description: NUT and the PDU, so NUT reaches the PDU without a router
    zone: Management
    state: planned
    id: 103
    subnets:
      - cidr: 10.0.3.0/29
        gateway_host: router2
        gateway_interface: VLAN103

  # ---------------------------------------------------------------------------------------------------
  # router1 zones
  # ---------------------------------------------------------------------------------------------------
  - name: dmz
    description: Public entry point and the DMZ K3s cluster
    zone: DMZ
    state: planned
    id: 4
    notes: DNS goes straight to Quad9 and Cloudflare, with no path inside.
    subnets:
      - cidr: 192.168.4.0/26
        gateway_host: router1
        gateway_interface: VLAN4

  # ---------------------------------------------------------------------------------------------------
  # router3 zone
  # ---------------------------------------------------------------------------------------------------
  - name: retronet
    description: Retro computers and consoles; internet-only, with in-house dial-up
    zone: RetroNet
    state: planned
    id: 5
    notes: |
      Served by router3 (Cisco 3825), which also handles PPP over its FXO/FXS ports. The outbound
      allowlist is enforced on router1; router3 keeps only a backstop rule blocking private addresses.
    subnets:
      - cidr: 192.168.5.0/26
        dhcp:
          enabled: true
          lease_time: 6h
          pool: 192.168.5.50-192.168.5.62
        gateway_host: router3
        gateway_interface: GigabitEthernet1/0.5

  # ---------------------------------------------------------------------------------------------------
  # router2 zones (all inside 192.168.16.0/20)
  # ---------------------------------------------------------------------------------------------------
  - name: central-servers
    description: Bootstrap-tier services (DNS, step-ca, OpenBao, Samba AD, Authelia) and file1
    zone: Central-Servers
    state: planned
    id: 16
    subnets:
      - cidr: 192.168.16.0/27
        gateway_host: router2
        gateway_interface: VLAN16

  - name: app-servers
    description: App-Servers K3s cluster nodes
    zone: App-Servers
    state: planned
    id: 17
    subnets:
      - cidr: 192.168.17.0/26
        gateway_host: router2
        gateway_interface: VLAN17

  - name: devops
    description: GitLab and its runners
    zone: DevOps
    state: planned
    id: 18
    subnets:
      - cidr: 192.168.18.0/28
        gateway_host: router2
        gateway_interface: VLAN18

  - name: security
    description: Security Onion, CrowdSec LAPI, Prometheus and Grafana
    zone: Security
    state: planned
    id: 19
    notes: Not mirrored to Security Onion; it is the collector.
    subnets:
      - cidr: 192.168.19.0/28
        gateway_host: router2
        gateway_interface: VLAN19

  - name: users
    description: Household workstations and personal devices
    zone: Users
    state: planned
    id: 20
    subnets:
      - cidr: 192.168.20.0/24
        dhcp:
          enabled: true
          lease_time: 24h
          dns: [9.9.9.9, 149.112.112.112, 1.1.1.1, 1.0.0.1]   # temporary, blog issue #688: Quad9 and Cloudflare until Step 2.3 moves it to dns1
          pool: 192.168.20.128-192.168.20.254
        gateway_host: router2
        gateway_interface: VLAN20

  - name: guest
    description: Guest Wi-Fi; internet plus the two printers by address
    zone: Guest
    state: planned
    id: 21
    notes: Client isolation on. DNS goes straight to Quad9 and Cloudflare.
    subnets:
      - cidr: 192.168.21.0/24
        dhcp:
          enabled: true
          lease_time: 6h
          dns: [9.9.9.9, 149.112.112.112, 1.1.1.1, 1.0.0.1]   # Quad9 and Cloudflare
          pool: 192.168.21.10-192.168.21.254
        gateway_host: router2
        gateway_interface: VLAN21

  - name: devices
    description: Printers and other shared peripherals
    zone: Devices
    state: planned
    id: 22
    subnets:
      - cidr: 192.168.22.0/26
        dhcp:
          enabled: true
          lease_time: 6h
          dns: [9.9.9.9, 149.112.112.112, 1.1.1.1, 1.0.0.1]   # temporary, blog issue #688: Quad9 and Cloudflare until Step 2.3 moves it to dns1
          pool: 192.168.22.50-192.168.22.62
        gateway_host: router2
        gateway_interface: VLAN22

  - name: fabrication
    description: 3D printers now; laser, CNC and vinyl cutter once bought
    zone: Devices
    state: planned
    id: 23
    notes: |
      No internet. Only Users reach it. DHCP serves static leases only (RouterOS
      address-pool=static-only): each named machine that can't hold a fixed address gets its
      systems.yml address by its MAC address, and unknown devices get nothing (blog issue #656).
      The MAC addresses are not recorded here; they go in router2's lease list. The DHCP server
      hands out no DNS server, since the machines only need the LAN (blog issue #678; RouterOS
      dns-none=yes, or it passes on router2's own). Lease time is 1 day (blog issue #679).
    subnets:
      - cidr: 192.168.23.0/27
        dhcp:
          enabled: true
          lease_time: 24h
          pool: null        # static-only: no pool
        gateway_host: router2
        gateway_interface: VLAN23

  - name: smart-home
    description: Smart home devices and hubs
    zone: Smart Home
    state: planned
    id: 24
    notes: |
      Client isolation on ap1, which can be turned off if devices need to talk to each other.
      Home Assistant (ha1) sits here because device discovery is multicast (issue #98).
    subnets:
      - cidr: 192.168.24.0/26
        dhcp:
          enabled: true
          lease_time: 6h
          dns: [9.9.9.9, 149.112.112.112, 1.1.1.1, 1.0.0.1]   # temporary, blog issue #688: Quad9 and Cloudflare until Step 2.3 moves it to dns1
          pool: 192.168.24.20-192.168.24.62
        gateway_host: router2
        gateway_interface: VLAN24

  - name: surveillance
    description: Cameras and the NVR host
    zone: Surveillance
    state: planned
    id: 25
    notes: |
      Built in Phase 1, empty; the cameras and nvr1 are one optional upgrade (issue #98). The
      cameras reach nothing outside the zone. The NVR host (nvr1) reaches only named update
      domains (Debian, Frigate's image registry), Security's Log_Collectors and CrowdSec LAPI, the
      resolvers, and file1's restic REST server. Users never reach the zone directly: the
      internal proxy and ha1 are the only ways in, plus bastion and runner SSH to nvr1. Cameras
      use IP addresses, not DNS. Ports untagged in VLAN 25 on switch2's second stack unit. Not
      mirrored (video volume). The DHCP server hands out no DNS server, since the cameras and
      the NVR don't need names (blog issue #698; RouterOS dns-none=yes, or it passes on
      router2's own).
    subnets:
      - cidr: 192.168.25.0/27
        dhcp:
          enabled: true
          lease_time: 6h
          pool: 192.168.25.20-192.168.25.30
        gateway_host: router2
        gateway_interface: VLAN25

  # ---------------------------------------------------------------------------------------------------
  # Unrouted
  # ---------------------------------------------------------------------------------------------------
  - name: storage
    description: 10G path between file1's storage port and each App-Servers node's second interface
    zone: App-Servers
    state: planned
    id: 26
    notes: |
      Unrouted, no gateway, never mirrored (issue #71). SMB, NFS, the database apps and the restic
      REST server listen on file1's interface here (issue #83); clients outside App-Servers use
      file1's Central-Servers address instead (issue #107). ID 26 was set when the inventory took
      the design; no ticket fixed it.
    subnets:
      - cidr: 192.168.26.0/28
